/* ============ BKT（Corbett-Anderson 更新式，纯确定性数学——回放重演用的同一份公式） ============ */
function bktUpdate(p, correct, bkt) {
  const pl = correct
    ? (p * (1 - bkt.pSlip)) / (p * (1 - bkt.pSlip) + (1 - p) * bkt.pGuess)
    : (p * bkt.pSlip) / (p * bkt.pSlip + (1 - p) * (1 - bkt.pGuess));
  return pl + (1 - pl) * bkt.pTransit;
}

      if (w.pending.type === "skip") {
        move = "quiz"; reason = "学生请求换题 → 出下一题（掌握度不变，无 BKT 观测）";
      } else if (w.pending.type === "help") {
        move = lvl0 >= 3 ? "teach" : "socratic";
        reason = "学生点「求助」→ 保持本题放提示（阶梯第 " + Math.min(3, lvl0 + 1) + " 级，无 BKT 观测）";
      } else if (streak >= THR.streakWrong && repairTarget) {
        move = "repair";
        reason = skill.name + "连错 " + streak + " 题（阈值 连错" + THR.streakWrong + "）→ 回前置技能「" + repairTarget.name + "」";
      } else if (p < THR.pRepair && repairTarget) {
        move = "repair";
        reason = "p=" + fmtP(p) + " < " + THR.pRepair + "（pRepair 阈值）→ 回前置技能「" + repairTarget.name + "」";
      } else if (p < THR.pRepair) {
        move = "teach"; reason = "p=" + fmtP(p) + " < " + THR.pRepair + " 且无未达标前置可回 → 直接讲解";
      } else if (p < THR.pSocratic) {
        move = lvl0 >= 3 ? "teach" : "socratic";
        reason = "p=" + fmtP(p) + " < " + THR.pSocratic + "（pSocratic 阈值）→ " +
          (move === "teach" ? "三级阶梯已尽，直接讲解" : "苏格拉底提示（阶梯第 " + (lvl0 + 1) + " 级）");
      } else if (p < THR.pAdvance) {
        move = "quiz";
        reason = "p=" + fmtP(p) + " ∈ [" + THR.pSocratic + ", " + THR.pAdvance + ") → 出题巩固（" +
          (p < THR.pQuiz ? "基础档" : "挑战档") + "，pQuiz=" + THR.pQuiz + "）";
      } else {
        move = "advance";
        reason = "p=" + fmtP(p) + " ≥ " + THR.pAdvance + "（pAdvance 阈值）→ 进阶下一技能";
      }

      /* ② 话术窄口：在线 LLM（JSON 协议，opts.max=perCallMax），断网/降级 → 规则兜底 */
      let source = "rule", tokens = 0, hint = "", askBack = "", rationale = "";
      const lvl = (move === "socratic" || move === "teach") ? Math.min(3, lvl0 + 1) : lvl0;
      if (providerReady && !cheap) {
        const recalled = mem.retrieve(STUDENT.id, sid, item.stem + " " + (item.misconception || ""), w.turn, 4);
        const tb = bubble("thinking", "白老师正在备课……");
        try {
          const out = await provider.complete([
            { role: "system", content: this.prompt(w, { move, lvl, p, item, skill, recalled }) },
            { role: "user", content: "学生输入：" + describeInput(w.pending) +
              "，判分：" + (w.grade.correct === null ? "无（求助/换题不作答）" : w.grade.correct ? "对" : "错") +
              "。请严格按【教学动作·输出协议】只输出 JSON。" },
          ], { json: true, max: BUD.perCallMax, temp: 0.7 });
          tb.remove();
          const j = extractJSONLoose(out);
          if (j && j.hint) {
            hint = String(j.hint).slice(0, 320);
            askBack = String(j.askBack || "").slice(0, 140);
            rationale = String(j.rationale || "").slice(0, 220);
            source = "llm";
          } else {
            sys("（白老师的教案格式异常——已改用固定提示阶梯，本帧 0 token）");
          }
        } catch (e) {
          tb.remove();
          sys("（模型调用失败：" + esc(String(e.message || e)) + "——已用规则话术兜底，本帧 0 token）");
        }
        const d = syncStats(); tokens = d.tokens;
      }
      if (source === "rule") {
        if (move === "socratic") {
          hint = item.hints[lvl - 1] || item.hints[2];
          askBack = ASK_BACK[Math.min(2, Math.max(0, lvl - 1))];
        } else if (move === "teach") {
          hint = "三级阶梯连讲：" + item.hints.join(" → ") + " 结论：" + item.answer + "。";
          askBack = "现在用自己的话，把这道题再说一遍？";
        } else if (move === "quiz") {
          hint = w.pending.type === "skip" ? "好，换一题——注意刚才的错因，稳住分数单位。" : "不错，再练一题巩固手感。";
        } else if (move === "repair") {
          hint = "先回「" + (repairTarget ? repairTarget.name : skill.name) + "」补一补地基，很快回来。";
        } else if (move === "advance") {
          hint = skill.name + "已达 " + skill.mastery + "，进阶下一个技能！";
        }
      }
      if (cheap && providerReady)
        reason += " · 预算余 " + Math.round(bud.pct * 100) + "% < " + Math.round(BUD.cheapBelow * 100) + "%（cheapBelow）→ 降级规则话术，本帧 0 token";

      /* ③ 动作落地（换技能/换题/结课） */
      if (move === "socratic" || move === "teach") {
        w.hints[item.id] = lvl;
      } else if (move === "quiz") {
        const nx = this.pickQuizItem(w, sid, p);
        if (nx) { w.cur.itemId = nx.id; }
        else { move = "advance"; reason += " · 本技能题库已练完 → 顺延进阶"; }
      } else if (move === "repair") {
        if (repairTarget) {
          w.cur.skillId = repairTarget.id;
          w.cur.itemId = this.firstItem(w, repairTarget.id);
        } else { move = "teach"; reason += "（无未达标前置，改为直接讲解）"; }
      }
      if (move === "advance") {
        const nx = SK.find(s => w.p[s.id] < s.mastery);
        if (nx) { w.cur.skillId = nx.id; w.cur.itemId = this.firstItem(w, nx.id); }
        else { w.lessonDone = true; }
      }
      w.action = { move, reason, hint, askBack, rationale, source, tokens };
      sceneReact(move);
      if (w.lessonDone) sys("🎓 本课全部技能达标——「课程」页可「次日续档」，「回放」页可逐帧审计这节课。");
    }
    pickQuizItem(w, sid, p) {
      let pool = itemsOf(sid).filter(i => !w.done[i.id]);
      if (!pool.length) {
        const wrongIds = new Set(w.frames.filter(f => f.correct === false && f.skillId === sid).map(f => f.itemId));
        pool = itemsOf(sid).filter(i => wrongIds.has(i.id));
        pool.forEach(i => { delete w.done[i.id]; });
        if (!pool.length) return null;
      }
      return p < THR.pQuiz ? pool[0] : pool[pool.length - 1];
    }
    firstItem(w, sid) {
      /* 返回题 id 字符串（cur.itemId 全局契约是 id，非题对象——返回对象会让 itemById 落空、renderQuestion 崩） */
      const it = itemsOf(sid).find(i => !w.done[i.id]) || itemsOf(sid)[0];
      return it ? it.id : null;
    }
    prompt(w, { move, lvl, p, item, skill, recalled }) {
      return `你在一场名为「${GAME.name}」的辅导课原型里扮演 AI 导师。
角色：${TUTOR.name}（${TUTOR.role}），人设：${TUTOR.persona}
学生：${STUDENT.name}。当前课次：第 ${w.day} 课 · 剧情环节：${(STORY.beats[w.beat] || {}).title || ""}
当前技能：「${skill.name}」（${skill.id}），掌握概率 p=${fmtP(p)}（阈值表：pRepair<${THR.pRepair} / pSocratic<${THR.pSocratic} / pQuiz<${THR.pQuiz} / pAdvance≥${THR.pAdvance}）
当前题：${item.stem}（选项：${(item.options || []).join(" / ")}；正确答案：${item.answer}）
固定提示阶梯（第 1~3 级，参考其风格按第 ${lvl} 级现编，不要照抄）：
${item.hints.map((h, i) => `  第${i + 1}级：${h}`).join("\n")}
该生此技能历史（引擎 L9 记忆检索）：
${recalled.length ? recalled.map(m => `- (第${m.day}课·回合${m.turn}) ${m.text}`).join("\n") : "-（暂无，可能是第一次学这个技能）"}
教学决策（已由导演按阈值确定，move 原样回传不得更改）：${move}
（现在执行教学动作：严格按人设中的【教学动作·输出协议】只输出 JSON，不输出任何其他文字。）`;
    }
  }
  /* ③ 决策帧记录器：每步落帧（审计的唯一事实源） */
  class FrameRecorderSystem {
    async tick(w) {
      if (!w.pending || !w.grade || !w.action) return;
      const bud = budgetNow();
      const f = {
        seq: w.frames.length + 1, day: w.day, turn: w.turn, beat: w.beat,
        skillId: w.grade.sid, itemId: w.grade.itemId,
        input: describeInput(w.pending),
        correct: w.grade.correct,
        pBefore: w.grade.pB, pAfter: w.grade.pA,
        move: w.action.move, reason: w.action.reason, rationale: w.action.rationale,
        hint: w.action.hint, source: w.action.source, tokens: w.action.tokens,
        budgetAfter: { grant: bud.grant, recycled: bud.recycled, used: bud.used, remaining: bud.remaining },
        calls: w.tally.calls, errors: w.tally.errors,
        ts: Date.now(),
      };
      w.frames.push(f);
      persistAll();
      tutorBubble(w.action);
      frameBubble(f);
      maybeAdvanceBeats(f);
      renderQuestion(); renderHUD(); renderReplay(); renderCodex(); renderStory();
    }
  }
  function describeInput(pg) {
    if (pg.type === "answer") return "选择「" + pg.choice + "」";
    if (pg.type === "help") return "点「求助」";
    return "点「换一题」";
  }
  function tutorBubble(a) {
    let txt = a.hint || "";
    if (a.askBack) txt += "\n❓ " + a.askBack;
    npcLine(TUTOR.name, txt);
    if (a.rationale && a.source === "llm") bubble("sys", "（导师理由：" + esc(a.rationale) + "）");
  }
  function frameBubble(f) {
    bubble("frame", `<span class="fh">📋 决策帧 #${f.seq}</span> ${MOVE_ZH[f.move]} · 来源 ${f.source === "llm" ? "AI 现编" : "规则阶梯"} · 本帧 ${f.tokens} token<br>` +
      `输入：${esc(f.input)}${f.correct === null ? "（无观测）" : f.correct ? " → 判对" : " → 判错"} · ${esc(skillById(f.skillId).name)} p: ${f.pBefore.toFixed(2)}→${f.pAfter.toFixed(2)}<br>` +
      `<span class="dim">理由：${esc(f.reason)}</span>`);
  }

  const scheduler = new mod.Scheduler();
  /* kernel.js:272 的 add() 不返回 this——逐个注册，不可链式 */
  scheduler.add(new GraderSystem());
  scheduler.add(new TeachDirectorSystem());
  scheduler.add(new FrameRecorderSystem());

  /* ---- 学生每提交一步：pump 一次调度器（判分→导演→落帧） ---- */
  let busy = false;
  async function step(pg) {
    if (busy || world.lessonDone) return;
    busy = true;
    world.pending = pg; world.turn++;
    if (pg.type === "answer") bubble("me", "答：" + pg.choice);
    else if (pg.type === "help") bubble("me", "🙋 求助");
    else bubble("me", "🔄 换一题");
    setQEnabled(false);
    try {
      await scheduler.tick(world);
    } finally {
      busy = false;
      world.pending = null; world.grade = null; world.action = null;
      persistAll();
      setQEnabled(true);
      renderQuestion(); renderHUD();
    }
  }

  /* ---- 剧情环节（自动推进：摸底→苏格拉底→挑战→小结→家长回放→次日续档） ---- */
  function setBeat(n) {
    if (n <= world.beat || n >= STORY.beats.length) return;
    world.beat = n; save("beat", n);
    const b = STORY.beats[n];
    if (b) sys("📖 进入环节「" + b.title + "」——" + b.desc.slice(0, 42) + "…");
    renderStory();
  }
  function maybeAdvanceBeats(f) {
    if (world.beat < 1 && ["socratic", "teach", "repair"].includes(f.move)) setBeat(1);
    if (world.beat < 2 && SK.some(s => world.p[s.id] >= THR.pQuiz)) setBeat(2);
    if (world.beat < 3 && (world.lessonDone || world.frames.length >= 10)) {
      setBeat(3);
      sys("🧮 小结：" + SK.map(s => s.name + " p=" + fmtP(world.p[s.id])).join(" · "));
    }
  }
  function nextDay() {
    if (world.beat < 3) return;
    world.day++;
    world.budget = { used: 0, recycled: 0 };
    world.done = {}; world.hints = {}; world.streak = {}; world.lessonDone = false;
    const weakest = SK.filter(s => world.p[s.id] < s.mastery).sort((a, b) => world.p[a.id] - world.p[b.id])[0] || SK[0];
    world.cur = { skillId: weakest.id, itemId: itemsOf(weakest.id)[0].id };
    persistAll();
    setBeat(5);
    /* 跨课记忆演示：白老师背出昨天画像（L9 检索） */
    const lines = SK.map(s => mem.retrieve(STUDENT.id, s.id, s.name, world.turn, 2)
      .map(e => "第" + e.day + "课 " + e.text)).flat().slice(0, 6);
    npcLine(TUTOR.name, "新的一课！课时拨款重置为 " + BUD.lessonTokens + " token。先对一下昨天的账——\n" +
      (lines.length ? lines.map(l => "· " + l).join("\n") : "· 昨天没有留下记录") +
      "\n今天从「" + weakest.name + "」继续（当前最低 p=" + fmtP(world.p[weakest.id]) + "）。");
    renderAll();
  }

  /* ---- 渲染 ---- */
  function setQEnabled(on) {
    document.querySelectorAll("#qbox button").forEach(b => { b.disabled = !on; });
  }
  function renderQuestion() {
    const q = document.getElementById("qbox");
    if (world.lessonDone) {
      q.innerHTML = `<div class="qcard"><div class="qskill"><span>✅ 本课完成</span><span>掌握度全部 ≥ ${SK[0].mastery}</span></div>
        <div class="qstem">四个技能全部达标。</div>
        <div style="font-size:12.5px;color:#8a93ad;line-height:1.7">去「📖 课程」页点「次日续档」开新课（拨款重置·画像留存），或去「⏪ 回放」页拖时间轴逐帧审计这节课。</div></div>`;
      return;
    }
    const skill = skillById(world.cur.skillId);
    const item = itemById(world.cur.itemId);
    const lvl = world.hints[item.id] || 0;
    q.innerHTML = `<div class="qcard">
      <div class="qskill"><span>📘 ${esc(skill.name)}（${skill.id}）· p(掌握)=${fmtP(world.p[skill.id])}${(world.streak[skill.id] || 0) ? " · 连错 " + world.streak[skill.id] : ""}</span><span>💡 阶梯 ${lvl}/3</span></div>
      <div class="qstem">${esc(item.stem)}</div>
      ${(item.options || []).map((o, i) => `<button class="opt" data-o="${esc(o)}">${String.fromCharCode(65 + i)}．${esc(o)}</button>`).join("")}
      <div id="q-actions">
        <button id="btn-help">🙋 求助（放提示阶梯）</button>
        <button id="btn-skip">🔄 换一题</button>
      </div>
    </div>`;
    q.querySelectorAll(".opt").forEach(b => b.onclick = () => step({ type: "answer", choice: b.dataset.o }));
    document.getElementById("btn-help").onclick = () => step({ type: "help" });
    document.getElementById("btn-skip").onclick = () => step({ type: "skip" });
    setQEnabled(!busy);
  }
  function renderHUD() {
    document.getElementById("day").textContent = world.day;
    const skill = skillById(world.cur.skillId);
    document.getElementById("hud-skill").textContent = skill.name;
    document.getElementById("hud-p").textContent = "p=" + fmtP(world.p[skill.id]);
    const bud = budgetNow();
    document.getElementById("hud-budget").textContent =
      Math.round(bud.remaining) + "/" + Math.round(bud.grant + bud.recycled) + "（" + Math.round(bud.pct * 100) + "%）";
    document.getElementById("budget-chip").classList.toggle("low", bud.pct < BUD.cheapBelow);
    document.getElementById("hud-frames").textContent = world.frames.length;
  }
  function renderStory() {
    const el = document.getElementById("page-story");
    let html = `<p class="hint" style="margin-bottom:10px">${esc(STORY.premise)}</p>`;
    STORY.beats.forEach((b, i) => {
      const cls = i === world.beat ? "now" : (i < world.beat ? "done" : "");
      html += `<div class="beat ${cls}"><div class="ph">${esc(b.phase)}${i < world.beat ? " · 已完成" : i === world.beat ? " · 进行中" : ""}</div><div class="tt">${esc(b.title)}</div><div class="ds">${esc(b.desc)}</div></div>`;
    });
    html += `<button id="btn-nextday" ${world.beat >= 3 && !world.lessonDone || world.lessonDone ? "" : "disabled"}>🌙 次日续档（开第 ${world.day + 1} 课：拨款重置 · 画像留存）</button>`;
    el.innerHTML = html;
    const btn = document.getElementById("btn-nextday");
    if (btn) btn.onclick = nextDay;
  }
  function renderCodex() {
    let html = "<h4>核心循环（答 → 调 → 放）</h4>";
    GAME.core_loop.forEach(s => { html += `<div class="mech"><div>${esc(s)}</div></div>`; });
    html += "<h4>机制系统</h4>";
    GAME.mechanics.forEach(m => { html += `<div class="mech"><b>${esc(m.name)}</b><div>${esc(m.detail)}</div></div>`; });
    html += "<h4>经济循环</h4><table class=\"eco\"><tr><th>资源</th><th>来源</th><th>去向</th></tr>";
    GAME.economy.forEach(r => { html += `<tr><td>${esc(r.name)}</td><td>${esc(r.source)}</td><td>${esc(r.sink)}</td></tr>`; });
    html += "</table><h4>技能图谱（BKT 实时参数）</h4>";
    SK.forEach(s => {
      html += `<div class="mech"><b>${esc(s.name)}（${s.id}）· p=${fmtP(world.p[s.id])} / mastery ${s.mastery}</b>` +
        `<div>${s.prereq.length ? "前置：" + s.prereq.join("←") : "入口技能"} · pInit ${s.bkt.pInit} · pTransit ${s.bkt.pTransit} · pSlip ${s.bkt.pSlip} · pGuess ${s.bkt.pGuess}${(world.streak[s.id] || 0) ? " · 当前连错 " + world.streak[s.id] : ""}</div></div>`;
    });
    html += "<h4>🧠 跨课画像（引擎 L9 记忆 · 当前技能）</h4>";
    const cur = skillById(world.cur.skillId);
    const recalled = mem.retrieve(STUDENT.id, world.cur.skillId, cur.name, world.turn, 4);
    html += recalled.length
      ? recalled.map(e => `<div class="mech"><div>(第${e.day}课 · 回合${e.turn}) ${esc(e.text)}</div></div>`).join("")
      : `<div class="mech"><div>（暂无「${esc(cur.name)}」的历史——第一次学）</div></div>`;
    html += `<div class="mech"><div>画像按「技能摘要」入库（about=${esc(cur.id)} 吃检索加成，单生上限 60 条）；逐题明细由决策帧日志承担。</div></div>`;
    html += `<h4>存档</h4><div style="display:flex;gap:8px">
      <button id="btn-reset" style="background:#2a1220;color:#e0a0b0;border:1px solid #6b2a3a;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px">🗑 清档重修（清空画像与决策帧）</button>
    </div>
    <p style="color:#5f6b8a;font-size:11px;margin:8px 0 0">掌握度/决策帧/画像全在本浏览器 localStorage——换浏览器即丢。</p>`;
    const el = document.getElementById("page-codex");
    el.innerHTML = html;
    el.querySelector("#btn-reset").onclick = () => {
      if (!window.confirm("清空画像、掌握度与决策帧，回到第 1 课？")) return;
      Object.keys(localStorage).filter(k => k.startsWith("game." + GAME.id + ".")).forEach(k => localStorage.removeItem(k));
      mem.clear();
      location.reload();
    };
  }

  /* ---- 【放】回放：事件溯源重演（fold 从 pmap0 重算 BKT，逐帧与记录值对质） ---- */
  function foldTo(upTo) {
    const p = {}; SK.forEach(s => p[s.id] = world.pmap0[s.id]);
    for (let i = 0; i <= upTo; i++) {
      const f = world.frames[i];
      if (f && f.correct !== null) p[f.skillId] = bktUpdate(p[f.skillId], f.correct, skillById(f.skillId).bkt);
    }
    return { p };
  }
  let replayIdx = -1;
  function renderReplay() {
    const el = document.getElementById("page-replay");
    const n = world.frames.length;
    if (replayIdx < 0 || replayIdx >= n) replayIdx = n - 1;
    if (n === 0) {
      el.innerHTML = `<h4>⏪ 回放时间轴</h4><div class="mech"><div>还没有决策帧——去「📝 课堂」页答一道题试试：每一步（作答/求助/换题）都会落一张可审计的帧。</div></div>`;
      return;
    }
    el.innerHTML = `
      <h4>⏪ 回放时间轴（${n} 帧 · 事件溯源重演）</h4>
      <input type="range" id="tl" min="0" max="${n - 1}" value="${Math.max(0, replayIdx)}" style="width:100%">
      <div class="tl-dots">${world.frames.map((f, i) => `<span class="tl-dot m-${f.move}${i === replayIdx ? " on" : ""}" data-i="${i}" title="帧${f.seq} ${MOVE_ZH[f.move]}"></span>`).join("")}</div>
      <div id="frame-detail"></div>
      <div style="display:flex;gap:8px;margin:12px 0">
        <button id="btn-frame-say" class="rbtn">🔍 督学解说本帧</button>
        <button id="btn-report" class="rbtn">📋 生成期末审计报告</button>
      </div>
      <div id="audit-out"></div>`;
    el.querySelector("#tl").oninput = e => showFrame(+e.target.value);
    el.querySelectorAll(".tl-dot").forEach(d => d.onclick = () => showFrame(+d.dataset.i));
    el.querySelector("#btn-frame-say").onclick = narrateFrame;
    el.querySelector("#btn-report").onclick = genReport;
    showFrame(Math.max(0, replayIdx));
  }
  function showFrame(i) {
    replayIdx = Math.max(0, Math.min(i, world.frames.length - 1));
    const f = world.frames[replayIdx];
    const fold = foldTo(replayIdx);
    const ok = f.correct === null || Math.abs(fold.p[f.skillId] - f.pAfter) < 1e-9;
    const dl = f.pAfter - f.pBefore;
    document.getElementById("frame-detail").innerHTML = `<div class="fcard">
      <div class="fh">📋 决策帧 #${f.seq} · 第${f.day}课 回合${f.turn} · ${esc((STORY.beats[f.beat] || {}).title || "")}</div>
      <table class="ftab">
        <tr><td>学生输入</td><td>${esc(f.input)}${f.correct === null ? "（无 BKT 观测）" : f.correct ? " → <b style='color:#35d07f'>判对</b>" : " → <b style='color:#e07a7a'>判错</b>"}</td></tr>
        <tr><td>题目</td><td>${esc(itemById(f.itemId).stem)}</td></tr>
        <tr><td>技能</td><td>${esc(skillById(f.skillId).name)}（${f.skillId}）</td></tr>
        <tr><td>掌握度</td><td>p ${f.pBefore.toFixed(2)} → <b>${f.pAfter.toFixed(2)}</b>（Δ${(dl >= 0 ? "+" : "") + dl.toFixed(2)}）</td></tr>
        <tr><td>导演动作</td><td><b>${MOVE_ZH[f.move]}</b>（${f.move}）</td></tr>
        <tr><td>决策理由</td><td>${esc(f.reason)}</td></tr>
        ${f.rationale ? `<tr><td>导师措辞</td><td>${esc(f.rationale)}</td></tr>` : ""}
        <tr><td>话术来源</td><td>${f.source === "llm" ? "AI 现编（llm）" : "规则阶梯（rule）"}</td></tr>
        <tr><td>本帧消耗</td><td>${f.tokens} token · 预算余 ${Math.round(f.budgetAfter.remaining)}/${Math.round(f.budgetAfter.grant + f.budgetAfter.recycled)} · 累计调用 ${f.calls} 次（失败 ${f.errors}）</td></tr>
        <tr><td>重演校验</td><td>${ok ? "✅ 按帧日志从初始 p 重算 BKT，与记录值一致（对质通过）" : "❌ 重算不一致（" + fold.p[f.skillId].toFixed(4) + " ≠ " + f.pAfter + "）"}</td></tr>
      </table></div>`;
    document.querySelectorAll("#page-replay .tl-dot").forEach(d => d.classList.toggle("on", +d.dataset.i === replayIdx));
    const tl = document.getElementById("tl");
    if (tl) tl.value = replayIdx;
  }
  function frameFacts(f) {
    return `帧#${f.seq}（第${f.day}课·回合${f.turn}）：学生${f.input}${f.correct === null ? "（求助/换题，无观测）" : f.correct ? "判对" : "判错"}；技能「${skillById(f.skillId).name}」p ${f.pBefore.toFixed(2)}→${f.pAfter.toFixed(2)}；导演动作 ${MOVE_ZH[f.move]}；理由：${f.reason}；话术来源 ${f.source}；本帧 ${f.tokens} token，预算余 ${Math.round(f.budgetAfter.remaining)}。`;
  }
  async function narrateFrame() {
    const f = world.frames[replayIdx];
    if (!f) return;
    const out = document.getElementById("audit-out");
    if (!out) return;
    if (providerReady) {
      out.innerHTML = "<p class='hint'>督学翻底稿中……</p>";
      try {
        const txt = await provider.complete([
          { role: "system", content: `你在一场名为「${GAME.name}」的辅导课原型里扮演审计旁白。\n角色：${AUDITOR.name}（${AUDITOR.role}），人设：${AUDITOR.persona}\n按【旁白·输出要求】组织语言，不要输出 JSON。` },
          { role: "user", content: "单帧解说素材：" + frameFacts(f) },
        ], { max: Math.min(140, BUD.perCallMax), temp: 0.6 });
        syncStats();
        out.innerHTML = `<div class="mech"><b>${esc(AUDITOR.name)} · 帧解说（AI）</b><div>${esc(txt)}</div></div>`;
        renderHUD();
        return;
      } catch (e) {
        sys("（督学的模型调用失败：" + esc(String(e.message || e)) + "——用模板底稿）");
      }
    }
    out.innerHTML = `<div class="mech"><b>${esc(AUDITOR.name)} · 帧解说（模板）</b><div>${esc("第 " + f.seq + " 帧：学生" + f.input + (f.correct === null ? "，未产生观测" : f.correct ? "，判对" : "，判错") + "；「" + skillById(f.skillId).name + "」掌握度 " + f.pBefore.toFixed(2) + " → " + f.pAfter.toFixed(2) + "。导演依据「" + f.reason + "」选择" + MOVE_ZH[f.move] + "，本帧计 " + f.tokens + " token（来源 " + f.source + "）。数字均可按帧日志重演核对。")}</div></div>`;
  }
  function buildReport() {
    const F = world.frames;
    const days = new Set(F.map(f => f.day)).size || 1;
    const lines = [];
    lines.push(`课次：第 ${world.day} 课（日志跨 ${days} 个课日）· 总帧数 ${F.length}（AI 现编 ${F.filter(f => f.source === "llm").length} 帧 / 规则阶梯 ${F.filter(f => f.source === "rule").length} 帧）`);
    SK.forEach(s => {
      const fr = F.filter(f => f.skillId === s.id);
      if (!fr.length) { lines.push(`${s.name}（${s.id}）：0 帧 · p ${fmtP(world.p[s.id])}（未涉）`); return; }
      const first = fr[0], last = fr[fr.length - 1];
      const c = fr.filter(f => f.correct === true).length, w = fr.filter(f => f.correct === false).length;
      const d = last.pAfter - first.pBefore;
      lines.push(`${s.name}（${s.id}）：${fr.length} 帧 · 对 ${c}/错 ${w} · p ${first.pBefore.toFixed(2)} → ${last.pAfter.toFixed(2)}（Δ${(d >= 0 ? "+" : "") + d.toFixed(2)}）`);
    });
    const mis = {};
    F.filter(f => f.correct === false).forEach(f => {
      const k = ((itemById(f.itemId) || {}).misconception || "未标注").split("（")[0];
      mis[k] = (mis[k] || 0) + 1;
    });
    lines.push("错因分布：" + (Object.keys(mis).length ? Object.entries(mis).map(([k, v]) => k + "×" + v).join("；") : "（无错题）"));
    const mv = {};
    F.forEach(f => { mv[f.move] = (mv[f.move] || 0) + 1; });
    lines.push("动作分布：" + (Object.keys(mv).length ? Object.entries(mv).map(([k, v]) => MOVE_ZH[k] + "×" + v).join("；") : "（无）"));
    const bud = budgetNow();
    lines.push(`token 账目：消耗 ${Math.round(bud.used)}（累计调用 ${world.tally.calls} 次 · 失败 ${world.tally.errors} 次）· 答题回收 +${bud.recycled} · 余 ${Math.round(bud.remaining)}/${Math.round(bud.grant + bud.recycled)}`);
    let mismatch = 0;
    {
      const p = {}; SK.forEach(s => p[s.id] = world.pmap0[s.id]);
      for (const f of F) {
        if (f.correct !== null) {
          p[f.skillId] = bktUpdate(p[f.skillId], f.correct, skillById(f.skillId).bkt);
          if (Math.abs(p[f.skillId] - f.pAfter) > 1e-9) mismatch++;
        }
      }
    }
    lines.push(mismatch === 0
      ? `重演校验：✅ ${F.length} 帧全部从初始 p 重算 BKT 与记录值一致（事件溯源对质通过）`
      : `重演校验：❌ ${mismatch} 帧重算不一致，请人工核对`);
    return lines.join("\n");
  }
  async function genReport() {
    const out = document.getElementById("audit-out");
    if (!out) return;
    const rep = buildReport();
    let html = `<div class="mech"><b>📋 期末审计报告（确定性数字 · 全部取自决策帧日志）</b><div style="white-space:pre-wrap">${esc(rep)}</div></div>`;
    if (providerReady) {
      html += "<p class='hint'>督学润色中……</p>";
      out.innerHTML = html;
      try {
        const txt = await provider.complete([
          { role: "system", content: `你在一场名为「${GAME.name}」的辅导课原型里扮演审计旁白。\n角色：${AUDITOR.name}（${AUDITOR.role}），人设：${AUDITOR.persona}\n按【旁白·输出要求】出审计报告，不要输出 JSON。` },
          { role: "user", content: "审计底稿数据：\n" + rep },
        ], { max: BUD.perCallMax, temp: 0.6 });
        syncStats();
        html += `<div class="mech"><b>${esc(AUDITOR.name)} · 审计意见（AI）</b><div>${esc(txt)}</div></div>`;
      } catch (e) {
        html += `<p class="hint">（督学模型调用失败，仅呈确定性底稿）</p>`;
      }
    }
    out.innerHTML = html;
    renderHUD();
  }

  /* ---- 场景反馈（判定/动作 → 动画 + 光环脉冲） ---- */
  const CLIP = { correct: "Yes", wrong: "No", socratic: "Wave", teach: "Thumbs_Up", repair: "Running", advance: "Dance", quiz: "Jump" };
  let reactTimer = null;
  function playAll(clipName) {
    robots.forEach(r => {
      if (!r.mixer || !r.gltfAnims) return;
      const clip = r.gltfAnims.find(c => c.name === clipName) || r.gltfAnims.find(c => new RegExp(clipName, "i").test(c.name));
      if (!clip) return;
      r.mixer.stopAllAction(); r.mixer.clipAction(clip).reset().play();
    });
  }
  function flash(hex) {
    const c = new THREE.Color(hex), base = new THREE.Color(TH.ring);
    const t0 = performance.now(), dur = 900;
    (function pulse() {
      const k = (performance.now() - t0) / dur;
      if (k >= 1) { ring.material.color.copy(base); return; }
      ring.material.color.copy(base.clone().lerp(c, 0.65 * Math.sin(k * Math.PI)));
      requestAnimationFrame(pulse);
    })();
  }
  function sceneReact(kind) {
    if (!robots.length) return;
    playAll(CLIP[kind] || "Idle");
    if (kind === "correct" || kind === "advance") flash(0x35d07f);
    else if (kind === "wrong" || kind === "repair") flash(0xa83a3a);
    else flash(0x7eb8ff);
    clearTimeout(reactTimer);
    reactTimer = setTimeout(() => robots.forEach(r => {
      if (r.mixer && r.idle) { r.mixer.stopAllAction(); r.mixer.clipAction(r.idle).reset().play(); }
    }), 3200);
  }

  /* ---- Tabs ---- */
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll(".tab-page").forEach(p => p.classList.remove("on"));
    document.getElementById("page-" + b.dataset.t).classList.add("on");
    if (b.dataset.t === "replay") {
      if (world.beat >= 3) setBeat(4);
      else if (world.frames.length === 0) sys("（回放页随时可看：每答一步都会在这里落一张决策帧）");
      renderReplay();
    }
  });

  function renderAll() {
    renderQuestion(); renderHUD(); renderStory(); renderCodex(); renderReplay();
  }

  /* ---- 开场 ---- */
  document.getElementById("tagline").textContent = GAME.tagline;
  renderAll();
  sys(`欢迎来到「${esc(GAME.name)}」——学生 ${esc(STUDENT.name)} 的分数课（共 ${SK.length} 技能 / ${TRACK.items.length} 题）。`);
  npcLine(TUTOR.name, TUTOR.first_line);
  sys(`${AUDITOR.name}（${AUDITOR.role}）：「${AUDITOR.first_line}」`);
  if (world.frames.length > 0) {
    sys(`已载入 ${world.frames.length} 帧历史（跨 ${new Set(world.frames.map(f => f.day)).size} 课日）——「⏪ 回放」页可继续逐帧审计。`);
    const lastSkill = skillById(world.cur.skillId);
    sys(`续档中：当前技能「${esc(lastSkill.name)}」p=${fmtP(world.p[lastSkill.id])}，课时预算余 ${Math.round(budgetNow().remaining)} token。`);
  }

  /* ---- 主循环 ---- */
  const clock = new THREE.Clock();
  (function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    robots.forEach((r, j) => {
      r.label.position.y = 3.1 + Math.sin(clock.elapsedTime * 2 + j) * 0.06;
      if (r.mixer) r.mixer.update(dt);
    });
    controls.update();
    renderer.render(scene, camera);
  })();
  window.addEventListener("resize", () => {
    camera.aspect = sceneEl.clientWidth / sceneEl.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(sceneEl.clientWidth, sceneEl.clientHeight);
  });
}
boot();
</script>
</body>
</html>
