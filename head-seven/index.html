/* 【定制·独立部署】kernel 与 vendor 已随项目自带（engine/kernel.js、vendor/、utils/），
   相对路径解析：任意静态服务器根目录或 Studio /projects/{id}/ 下均可运行，Studio 内运行不破。 */
const VENDOR_BASE = "./vendor/";
const KERNEL = "./engine/kernel.js";

/* ============ L7 provider 装配（与引擎 café demo 同一机制） ============ */
/* 【定制⑨】DeepSeek 思考档适配层：V4 系默认 high 档推理会吃掉 max_tokens 预算，
   出现空正文/半句截断（实测 2026-10-19）。NPC 对话要延迟不要深度——在游戏层
   拦 fetch 给 deepseek 请求注入 thinking:disabled；vendored kernel 保持与引擎仓
   逐字节一致（check-game.mjs 的零漂移门禁继续成立），vendor 怪癖归游戏层管。 */
{
  const _fetch = window.fetch.bind(window);
  window.fetch = async (u, o) => {
    if (typeof u === "string" && u.includes("api.deepseek.com") && o && o.body) {
      try {
        const b = JSON.parse(o.body);
        if (b.model && b.thinking === undefined) b.thinking = { type: "disabled" };
        o = { ...o, body: JSON.stringify(b) };
      } catch (e) { /* 非 JSON 体原样放行 */ }
    }
    return _fetch(u, o);
  };
}
let provider = null, providerReady = false;
const savedCfg = JSON.parse(localStorage.getItem("aicafe.llm.v1") || "null");
async function boot() {
  let mod;

  lawBtn.onclick = () => setLawMode(!lawMode);
  function shakeInput() { /* 驳回/言灵不足：输入框抖动 */
    const el = document.getElementById("chat-input");

  }
  function extractJSONLoose(s) { const m = (s || "").match(/\{[\s\S]*\}/); try { return m ? JSON.parse(m[0]) : null; } catch { return null; } }
  const ARBITER = AGENTS[0]; /* 衡·阴律仲裁印（数组首位，《裁决输出协议》内置于 persona） */

  function renderVerdict(v, pass) {
    const cost = parseInt(v.cost, 10) || 0;

    const head = pass
      ? `<span class="vhead">⚖️ 衡 · 裁决书〔通过〕</span> 定价 ${cost} 言灵 · 法则域〔${domain}〕`
      : `<span class="vhead">⚖️ 衡 · 裁决书〔驳回〕</span> 本次不扣言灵`;
    bubble(pass ? "law" : "law rej", `${head}<br>${esc(v.narration || "")}${v.fx ? `<br><span class="vfx">〔世界效果〕${esc(v.fx)}</span>` : ""}`);
  }

  function applyVerdict(bill, v) {
    const pass = String(v.verdict) === "pass";
    if (!pass) { renderVerdict(v, false); shakeInput(); return; }
    const cost = Math.max(5, Math.min(30, parseInt(v.cost, 10) || 15));
    const domain = ["water", "light", "shadow", "time", "float"].includes(v.domain) ? v.domain : "float";
    if (coins < cost) {
      renderVerdict({ ...v, narration: (v.narration || "") + `（言灵不足：定价 ${cost}，现有 ${coins}——把措辞改短改准可降价，或先推进剧情攒言灵）` }, false);
      shakeInput(); return;

    spendCoins(cost, `⚖️ 立法生效，扣除 ${cost} 言灵`);
    /* 废法登记：法案明言废除/撤销，且同域有现行旧法 → 标记废止（双倍定价由衡按协议裁定） */
    if (/废|撤销|作废/.test(bill)) laws = laws.map(l => (!l.repealed && l.domain === domain) ? { ...l, repealed: true } : l);
    laws.push({ text: bill, domain, cost, day, repealed: false });
    saveLaws();
    renderVerdict(v, true);
    worldReact(domain, v.fx);
    renderCodex();
  }

  async function legislate(bill) {
    if (coins < 5) { sys(`言灵不足（现有 ${coins}，最低立法定价 5）——推进剧情 +15 言灵`); shakeInput(); return; }
    if (!providerReady) return offlineVerdict(bill); /* 【定制⑤】断网降级：五域关键词表 */
    const t = bubble("thinking", "⚖️ 衡正在裁决……");
    try {
      const out = await provider.complete([
        { role: "system", content: `你在一场名为「${GAME.name}」的游戏原型里扮演 NPC。
角色：${ARBITER.name}（${ARBITER.role}），人设：${ARBITER.persona}
世界观前提：${STORY.premise}
现行阴间法典摘要（全量，冲突/叠加/废法判定一律以此为准）：
${lawSummary()}
（现在执行立法裁决：严格按人设中的【立法裁决·输出协议】只输出 JSON，不输出任何其他文字。）` },
        { role: "user", content: `玩家法案：「${bill}」\n（输出 {verdict,cost,domain,fx,narration} 裁决书）` }
      ], { json: true, max: 250 });
      t.remove();
      const v = extractJSONLoose(out);
      if (!v || !v.verdict) { sys("（裁决书格式异常，衡沉默了——请换个措辞重新颁法）"); shakeInput(); return; }
      applyVerdict(bill, v);
    } catch (e) {
      t.remove(); sys(`（模型调用失败：${esc(String(e.message || e))}，本次立法未生效）`);
    }
  }

  /* 【定制⑤】离线裁决：水/光/影/时/浮五域关键词表 × 通过/驳回；法典字面查重只服务冲突驳回与定价参照 */
  function offlineVerdict(bill) {
    const KW = [
      ["water", /水|河|流|雨|雾|潮|浪|淹|海/g],
      ["light", /光|灯|亮|明|照|昼/g],
      ["shadow", /影子|影|形/g],
      ["time", /时间|钟|表|秒|刻|时|日|停摆|走/g],
      ["float", /浮|飘|升|离地|悬/g],
    ];
    const dup = laws.find(l => !l.repealed && (l.text === bill ||
      (bill.length >= 6 && l.text.includes(bill)) || (l.text.length >= 6 && bill.includes(l.text))));
    let v;
    if (dup) {
      v = { verdict: "reject", cost: 0, domain: dup.domain, fx: "",
        narration: `〔离线仲裁〕法典已有近似条文「${dup.text}」——重复立法驳回。要改，先以双倍言灵废旧法。` };
    } else {
      /* 各域关键词命中次数计分取最高——「让雾港的时间重新走」time 命中｛时间,走｝=2 胜过 water 命中｛雾｝=1 */
      const scored = KW.map(([d, re]) => [d, (bill.match(re) || []).length]).sort((a, b) => b[1] - a[1]);
      const hit = scored[0][1] > 0 ? scored[0] : null;
      if (!hit) {
        v = { verdict: "reject", cost: 0, domain: "float", fx: "",
          narration: "〔离线仲裁〕断网只识水/光/影/时/浮五域——此句五域皆不沾，驳回。联网后由衡按语义裁决任意法案。" };
      } else {
        const len = bill.length; /* 定价参照：越短越便宜（联网后由衡按语义精确定价） */
        const cost = len <= 8 ? 5 : len <= 14 ? 10 : 15;
        v = { verdict: "pass", cost, domain: hit[0],
          fx: `${DOMAIN_ZH[hit[0]]}域法则降临，雾港随之一变`,
          narration: `〔离线关键词仲裁·通过〕法则域〔${DOMAIN_ZH[hit[0]]}〕，定价 ${cost} 言灵。联网后语义裁决可按措辞精确度定价。` };
      }
    }
    applyVerdict(bill, v);
  }

  /* ============================== 【定制②】世界反馈：法则域渐变 + 全体 NPC 换动画 / 离地上浮 ============================== */
  const DOMAIN_TINTS = {
    water:  { bg: 0x1c3a55, ground: 0x2a4a66, ring: 0x5fa8d8, hemiSky: 0xbfe4ff, hemiGnd: 0x24384a, sun: 0xdff2ff, lift: 0 },
    light:  { bg: 0x3a2f1c, ground: 0x57431f, ring: 0xe8b24e, hemiSky: 0xffe9b8, hemiGnd: 0x40331c, sun: 0xffd98a, lift: 0 },
    shadow: { bg: 0x14121f, ground: 0x1e1b2e, ring: 0x6a5aa8, hemiSky: 0x9a8fd0, hemiGnd: 0x14121d, sun: 0xcfc4ff, lift: 0 },
    time:   { bg: 0x16323a, ground: 0x1e4148, ring: 0x54c8c0, hemiSky: 0xbff5ef, hemiGnd: 0x183237, sun: 0xe0fffb, lift: 0 },
    float:  { bg: 0x221430, ground: 0x301a42, ring: 0xb07ee0, hemiSky: 0xe6c8ff, hemiGnd: 0x241433, sun: 0xf4d9ff, lift: 0.9 },
  };
  const DOMAIN_CLIPS = { water: "Walking", light: "Dance", shadow: "Wave", time: "Running", float: "Jump" };
  let tint = null; /* { t, dur, from{...hex}, to{...} } —— 每帧由 animate() 补间 */
  const hexOf = c => "#" + c.getHexString();
  function setTint(domain) {
    const to = DOMAIN_TINTS[domain] || DOMAIN_TINTS.float;
    tint = { t: 0, dur: 1.8,
      from: { bg: hexOf(scene.background), ground: hexOf(ground.material.color), ring: hexOf(ring.material.color),
        hemiSky: hexOf(hemi.color), hemiGnd: hexOf(hemi.groundColor), sun: hexOf(sun.color) }, to };
  }
  function tickTint(dt) {
    if (!tint) return;
    tint.t = Math.min(1, tint.t + dt / tint.dur);
    const L = (a, b) => new THREE.Color(a).lerp(new THREE.Color(b), tint.t);
    scene.background.copy(L(tint.from.bg, tint.to.bg));
    scene.fog.color.copy(scene.background);
    ground.material.color.copy(L(tint.from.ground, tint.to.ground));
    ring.material.color.copy(L(tint.from.ring, tint.to.ring));
    hemi.color.copy(L(tint.from.hemiSky, tint.to.hemiSky));
    hemi.groundColor.copy(L(tint.from.hemiGnd, tint.to.hemiGnd));
    sun.color.copy(L(tint.from.sun, tint.to.sun));
    if (tint.t >= 1) tint = null;
  }
  function playAll(clipName) {

      n.mixer.stopAllAction(); n.mixer.clipAction(clip).reset().play();
    });
  }
  let liftCur = 0, liftTarget = 0;

  function worldReact(domain, fx) {

  /* 【应激自语】新法颁布后约一分钟内，一位居民以职业体感吐槽新法（仅在线；断网此层静默） */
  function scheduleLawMutter(domain) {

  async function send() {
    const text = say.value.trim(); if (!text) return;

      const msgs = [

  function ruleReply(i, text) {

  async function advance() {

    sys(`📖 第 ${day} 天 · 剧情推进：「${b.title}」`);

          /* 【定制④】导演输入拼现行法典摘要：旁白点名玩家立过的法如何改写雾港，并演出性宣判本拍双轨目标 */
          { role: "user", content: `前提：${STORY.premise}\n节拍：${b.phase}「${b.title}」——${b.desc}\n玩家已进行到第${day}天。\n玩家现行法典：\n${lawSummary()}\n（旁白要求：点名玩家立过的法如何改写了雾港；并宣判本拍双轨目标——阴间修复目标与阳间取证进展——是否达成。）` }
        ], { max: 200 });

  /* ---- 经济系统（v0.2 最小可玩循环）：推进剧情赚言灵，向商人买线索 ---- */
  let coins = JSON.parse(localStorage.getItem("game." + GAME.id + ".coins") || "100"); /* 【定制⑥】无存档初始 100 言灵 */

    if (lawMode && sendBtn) sendBtn.disabled = coins < 5;

  const buyBtn = document.getElementById("buy-hint");

  /* ---- 存档导出/导入（v0.2）：打包本游戏全部 localStorage（法典/信任表/线索计数等新键按 game.{id}.* 前缀自动纳入） ---- */
  function exportSave() {
    const data = {};
    for (let k = 0; k < localStorage.length; k++) {
      const key = localStorage.key(k);

  function importSave(file) {

  /* 玩法图鉴 */
  const doneSteps = new Set(JSON.parse(localStorage.getItem("game." + GAME.id + ".loop") || "[]"));
  function renderCodex() {
    let html = "<h4>核心循环</h4>";

      html += `<div class="loop-step ${doneSteps.has(i) ? "done" : ""}" data-i="${i}"><span>${doneSteps.has(i) ? "✅" : "▫️"}</span>${esc(s)}</div>`;

    html += "<h4>机制系统</h4>";
    GAME.mechanics.forEach(m => { html += `<div class="mech"><b>${esc(m.name)}</b><div>${esc(m.detail)}</div></div>`; });
    html += "<h4>经济循环</h4><table class=\"eco\"><tr><th>资源</th><th>来源</th><th>去向</th></tr>";
    GAME.economy.forEach(r => { html += `<tr><td>${esc(r.name)}</td><td>${esc(r.source)}</td><td>${esc(r.sink)}</td></tr>`; });
    html += `</table><h4>难度曲线</h4><div class="mech"><div>${esc(GAME.difficulty)}</div></div>`;
    /* 【定制③】阴间法典页（只读列表；砍掉与 doneSteps 的程序化联动，checklist 手动勾选） */
    html += "<h4>阴间法典（现行阴律）</h4>";
    if (!laws.length) html += `<div class="mech"><div>（尚无现行阴律——前任判官烂尾中。切 ⚖️ 立法模式写下第一句。）</div></div>`;
    laws.slice().reverse().forEach(l => {
      html += `<div class="mech"><b>〔${DOMAIN_ZH[l.domain] || "?"}〕${esc(l.text)}</b><div>${l.repealed ? "已废止" : "现行"} · ${l.cost} 言灵 · 第 ${l.day} 日立</div></div>`;
    });
    html += `<div class="mech"><b>线索菜单 ${hintCount}/${HINT_MENU.length}</b><div>向逆流商人溯按序购买，售罄即止（10 言灵/条）</div></div>`;
    html += `<h4>存档</h4><div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="btn-export-save" style="background:#2d5b9e;color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px">📤 导出存档</button>
      <button id="btn-import-save" style="background:#161a28;color:#cdd6ec;border:1px solid #2a3a5c;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px">📥 导入存档</button>
      <input type="file" id="save-file" accept="application/json" style="display:none" />
    </div>
    <p style="color:#5f6b8a;font-size:11px;margin:8px 0 0">言灵与法典都在浏览器里——换电脑前记得导出。</p>`;
    const el = document.getElementById("page-codex");
    el.innerHTML = html;
    el.querySelector("#btn-export-save").onclick = exportSave;
    el.querySelector("#btn-import-save").onclick = () => el.querySelector("#save-file").click();
    el.querySelector("#save-file").onchange = e => { if (e.target.files[0]) importSave(e.target.files[0]); };
    el.querySelectorAll(".loop-step").forEach(d => d.onclick = () => {
      const i = +d.dataset.i;
      doneSteps.has(i) ? doneSteps.delete(i) : doneSteps.add(i);
      localStorage.setItem("game." + GAME.id + ".loop", JSON.stringify([...doneSteps]));
      renderCodex();
    });
  }

  /* 居民列表 */
  function renderNpcList() {
    const el = document.getElementById("page-npcs");
    el.innerHTML = AGENTS.map((a, i) => `
      <div class="npc-row ${i === selected ? "sel" : ""}" data-i="${i}">
        <div class="npc-ava" style="background:#${npcs[i].color.toString(16).padStart(6,"0")}22;border:2px solid #${npcs[i].color.toString(16).padStart(6,"0")}"></div>
        <div><div class="npc-nm">${esc(a.name)} <span class="npc-rl">· ${esc(a.role)}</span></div>
        <div class="npc-pf">${esc(a.persona)}</div></div>
      </div>`).join("");
    el.querySelectorAll(".npc-row").forEach(d => d.onclick = () => select(+d.dataset.i));
  }

  /* Tabs */
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll(".tab-page").forEach(p => p.classList.remove("on"));
    document.getElementById("page-" + b.dataset.t).classList.add("on");
  });

  /* 开场 */
  document.getElementById("tagline").textContent = GAME.tagline;
  document.getElementById("day").textContent = day;
  renderCoins();
  renderStory(); renderCodex(); renderNpcList(); select(0);
  npcs[0] && sys(`欢迎来到「${esc(GAME.name)}」。${esc(AGENTS[0].name)}正在看你——去和 TA 说说第一句话吧。`);
  // NPC 开场白（顺序错开）
  AGENTS.forEach((a, i) => setTimeout(() => {
    if (i === selected) npcLine(i, a.first_line);
    else sys(`${a.name}（${a.role}）：「${a.first_line}」`);
  }, 600 + i * 2600));

  /* 自主性：每 45s 一位 NPC 随机开口（仅 AI 模式；断网此层静默） */
  setInterval(async () => {
    if (!providerReady) return;
    const i = Math.floor(Math.random() * AGENTS.length);
    try {
      // 注意：messages 不能只有 system——智谱/DeepSeek 等端点会直接 400
      const out = await provider.complete([
        { role: "system", content: systemPrompt(i) + "\n现在你没有被对话，请自然地自言自语或对世界发表一句感慨，1~2 句。" },
        { role: "user", content: "（此刻你在做什么？自然地说一句话）" }
      ], { max: 90 });
    if (i === selected) npcLine(i, out); else sys(`${AGENTS[i].name}：「${out}」`);
    parseTrust(out, AGENTS[i].name); /* 【定制⑧】自语同样产出立场尾行，回写信任表 */
    } catch (e) { /* 静默 */ }
  }, 45000);

  /* 主循环（【定制②·原地小改】挂接 tint/lift 每帧补间） */
  const clock = new THREE.Clock();
  (function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    npcs.forEach((n, j) => {
      n.label.position.y = 3.1 + liftCur + Math.sin(clock.elapsedTime * 2 + j) * 0.06;
      if (n.mixer) n.mixer.update(dt);
      if (j === selected) n.root.rotation.y += 0.004;
      n.root.position.y = liftCur;
    });
    tickTint(dt);
    liftCur += (liftTarget - liftCur) * Math.min(1, dt * 2.2);
    controls.update();
    renderer.render(scene, camera);
  })();
  window.addEventListener("resize", () => {
    camera.aspect = sceneEl.clientWidth / sceneEl.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(sceneEl.clientWidth, sceneEl.clientHeight);
  });
}
boot();
</script>
</body>
</html>
