<!doctype html>
<html lang="zh-CN">

  #tabs button.on { color: #7eb8ff; border-bottom-color: #7eb8ff; }
  .tab-page { flex: 1; overflow-y: auto; padding: 13px; display: none; }
  .tab-page.on { display: block; }
  .hint { font-size: 12px; color: #7c86a3; line-height: 1.6; margin: 6px 0; }
  .card { background: #161a28; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 12.5px; line-height: 1.6; }

  .chips button:hover, .chips button.sel { background: #1a2440; color: #7eb8ff; border-color: #3a5a8c; }

  table.grid th { text-align: left; color: #7c86a3; padding: 4px 6px; font-weight: 500; }
  table.grid td { padding: 6px; border-top: 1px solid #1e2536; color: #b6bfd6; }
  table.grid tr.runrow { cursor: pointer; }
  table.grid tr.runrow:hover, table.grid tr.runrow.sel { background: #1a2440; }
  .badge { display: inline-block; border-radius: 10px; padding: 1px 8px; font-size: 11px; }
  .badge.pass { background: #10321f; color: #57d98d; }
  .badge.fail { background: #3a1418; color: #ff8a8a; }
  .badge.timeout { background: #332a10; color: #ffd88a; }

  .memrow { background: #161a28; border-radius: 10px; padding: 9px 11px; margin-bottom: 7px; font-size: 12.5px; line-height: 1.55; }

</head>
<body>
<div id="app">
  <div id="scene">
    <div id="hud">
      <div class="chip"><b>复演台</b> · <span id="tagline"></span></div>

      <div class="chip">任务 <b id="hud-task">—</b></div>
      <div class="chip">种子 <b id="hud-seed">—</b></div>
      <div class="chip">预算 <b id="hud-budget" style="color:#ffd88a">100</b> 分</div>
      <div class="chip">通过 <b id="hud-pass">0/0</b></div>
      <div class="chip">记忆 <b id="hud-mem">0</b> 条</div>
      <div class="chip" id="hud-verify">帧校验待复演</div>
    </div>
    <div id="playbar">
      <b id="pb-run" style="color:#9fc3ff; white-space:nowrap">—</b>
      <button id="pb-play">▶ 播放</button>
      <input type="range" id="pb-slider" min="0" max="0" value="0" />
      <span id="pb-frame">0/0</span>
      <button class="verify" id="pb-verify">🔁 复演校验</button>
      <span id="pb-hash" class="dim">帧哈希 —</span>
    </div>
  </div>
  <div id="panel">
    <div id="tabs">
      <button class="on" data-t="task">🎯 出题</button>
      <button data-t="director">🎬 导演</button>
      <button data-t="runs">📊 跑测</button>
      <button data-t="memory">🧠 记忆</button>
      <button data-t="codex">📖 玩法</button>
    </div>
    <div id="page-task" class="tab-page on">
      <div class="row">
        <input type="text" id="nl" placeholder="一句话出题：如「把红杯推上杯垫，别碰倒玻璃瓶」" />
      </div>
      <div class="row">
        <button class="act" id="btn-nl-off">🎲 任务库出题</button>
        <button class="act green" id="btn-nl-ai">🤖 AI 出题（在线）</button>
      </div>
      <div class="chips" id="task-chips"></div>
      <div id="card-view"></div>
    </div>
    <div id="page-director" class="tab-page">
      <div class="card">
        <b class="tt">评测预算</b> <span style="font-size:20px;color:#ffd88a" id="budget-big">100</span> 分
        <div class="dim" id="budget-rule"></div>
      </div>
      <div class="row">
        <button class="act green" id="btn-runall">▶ 一键评测（跑到预算尽）</button>
        <button class="act dim3" id="btn-round">＋派生 1 轮</button>
      </div>
      <div class="hint" id="dir-status"></div>
      <div id="beat-view"></div>
      <div id="rounds-view"></div>
    </div>
    <div id="page-runs" class="tab-page">
      <table class="grid" id="runs-table"></table>
      <div class="hint" style="margin-top:8px">轨迹小地图（路径线 + 绿点=当前帧，点地图任意处跳到最近轨迹点）：</div>
      <canvas id="strip" width="380" height="170"></canvas>
      <div id="run-detail"></div>
    </div>
    <div id="page-memory" class="tab-page">
      <div class="row">
        <input type="text" id="mem-q" placeholder="检索失败片段：如「碰倒瓶子的失败」" />
        <button class="act" id="btn-mem-go">🔍 检索</button>
      </div>
      <div class="chips" id="mem-chips"></div>
      <div class="hint" id="mem-stat"></div>
      <div id="mem-view"></div>
      <div class="row" style="margin-top:10px">
        <button class="act dim3" id="btn-export">📤 导出数据集</button>
        <button class="act dim3" id="btn-mem-clear">🗑 清空记忆</button>
      </div>
    </div>
    <div id="page-codex" class="tab-page"></div>
  </div>
</div>
<div id="fallback">
  <div>
    <div style="font-size:40px">🤖</div>
    <h2 style="margin:12px 0">请通过静态服务器打开本项目</h2>
    <p style="color:#8a93ad">demo 依赖相对路径的 ES 模块（engine/kernel.js、vendor/、app/sim.js）。<br>
    在本目录起任意静态服务器即可（例：<code>npx serve .</code> 或 <code>python -m http.server</code>）。</p>
  </div>
</div>

{
  const _fetch = window.fetch.bind(window);
  window.fetch = async (u, o) => {
    if (typeof u === "string" && u.includes("api.deepseek.com") && o && o.body) {
      try {
        const b = JSON.parse(o.body);
        if (b.model && b.thinking === undefined) b.thinking = { type: "disabled" };
        o = { ...o, body: JSON.stringify(b) };
      } catch (e) { /* 非 JSON 体原样放行 */ }
    }
    return _fetch(u, o);
  };
}

  const gltf = await new GLTFLoader().loadAsync(VENDOR_BASE + "RobotExpressive.glb");
  robotMesh = gltf.scene;
  robotMesh.scale.setScalar(0.5);
  robotMesh.traverse((o) => { if (o.isMesh) o.castShadow = false; });
  scene.add(robotMesh);
  robotMixer = new THREE.AnimationMixer(robotMesh);
  robotAnims = gltf.animations;
  const idle = robotAnims.find((a) => /idle/i.test(a.name)) || robotAnims[0];
  if (idle) robotMixer.clipAction(idle).play();
  window.addEventListener("resize", () => {
    camera.aspect = sceneEl.clientWidth / sceneEl.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(sceneEl.clientWidth, sceneEl.clientHeight);
  });
  const clock = new THREE.Clock();
  (function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    if (S.play.playing && S.play.run) {
      S.play.frame = Math.min(S.play.run.total - 1, S.play.frame + S.play.speed);
      if (S.play.frame >= S.play.run.total - 1) { S.play.playing = false; $("pb-play").textContent = "▶ 播放"; }

function clearObjects() { while (objGroup && objGroup.children.length) objGroup.remove(objGroup.children[0]); }
function buildObjects(spec) {
  clearObjects();
  const tb = objGroup.parent.getObjectByName("table");
  if (tb) tb.scale.set(spec.table.w, 1, spec.table.h);
  for (const o of spec.objects) {
    const col = COLOR_HEX[o.color] ?? 0x888888;
    let m;
    if (o.type === "box") {
      m = new THREE.Mesh(new THREE.BoxGeometry(o.r * 2, OBJ_H.box, o.r * 2),
        new THREE.MeshStandardMaterial({ color: col, roughness: 0.8 }));
    } else {
      const h = OBJ_H[o.type] || 0.6;
      m = new THREE.Mesh(new THREE.CylinderGeometry(o.type === "bottle" ? o.r * 0.72 : o.r, o.r, h, 20),
        new THREE.MeshStandardMaterial({ color: col, roughness: o.type === "coaster" || o.type === "pad" ? 0.95 : 0.55 }));
      m.userData.h = h;
    }
    m.userData.spec = o;
    objGroup.add(m);
  }
  const dp = spec.objects.find((o) => o.id === spec.goal.dest);
  const tp = spec.objects.find((o) => o.id === spec.goal.target);
  if (dp) { destRing.position.set(dp.x, 0.14, dp.y); destRing.scale.setScalar(dp.r / 0.56); destRing.visible = true; }
  if (tp) { targetRing.position.set(tp.x, 0.14, tp.y); targetRing.scale.setScalar(tp.r / 0.49); targetRing.visible = true; }
  poseFromSpec(spec);
}
function poseObjects(spec, frame) {
  objGroup.children.forEach((m, i) => {
    const rec = frame ? frame.objs[i] : null;
    const sd = spec.objects[i];
    const h = m.userData.h || OBJ_H[sd.type] || 0.5;
    const x = rec ? rec[0] : sd.x, z = rec ? rec[1] : sd.y;
    const top = rec ? rec[2] : false;
    m.position.set(x, top ? (m.geometry.type === "BoxGeometry" ? OBJ_H.box / 2 : sd.r) : h / 2, z);
    m.rotation.set(0, 0, 0);
    if (top) {
      if (m.geometry.type === "BoxGeometry") { m.rotation.z = Math.PI / 2; m.position.y = sd.r; }
      else { m.rotation.x = Math.PI / 2; m.position.y = sd.r * 0.72; }
    }
  });
}
function poseFromSpec(spec) {
  poseObjects(spec, null);
  const st = SIM_MOD.robotStart(spec.table);
  robotMesh.position.set(st.x, 0, st.z);
  playMarker.visible = false;
}
function poseFromFrame() {
  const run = S.play.run; if (!run) return;
  const f = run.frames[S.play.frame];
  if (!f) return;
  poseObjects(run.spec, f);
  robotMesh.position.set(f.rx, 0, f.rz);
  robotMesh.rotation.y = Math.PI / 2 - f.dir; /* glb 朝 +z：航向角 dir 的朝向修正 */
  playMarker.visible = true;
  playMarker.position.set(f.rx, 0.16, f.rz);
  destRing.visible = targetRing.visible = false;
}

/* ============ 引擎装配：MemoryStore + Scheduler + DirectorSystem（仅在线挂载） ============ */
function wireEngine() {
  S.mem = new KERNEL_MOD.MemoryStore("game." + GAME.id + ".mem.v1");
  S.world = { turn: 0, day: 1, story: { day: 1, beats: [] }, dialogue: [] };
  S.sched = new KERNEL_MOD.Scheduler();
  S.sched.add({
    name: "变体派生", async tick(w) {
      const roundIdx = S.rounds.length + 1;
      /* 第 1 轮=基础轮：任务卡原样、免费、3 策略全量（设计：初始积分只为扰动变体付费） */
      if (roundIdx === 1) {
        w.pending = { roundIdx, ops: [], cost: 0, reason: "基础轮：任务卡原样跑测（免费）", label: "基础轮",
          spec: JSON.parse(JSON.stringify(S.spec)), log: [], seed: S.spec.seed };
        return;
      }
      let ops = null, cost = 0, reason = "", label = "";
      if (providerReady) {
        try {
          const last = S.lastResults;
          const memLines = directorMemoryLines(2);
          const out = await provider.complete([
            { role: "system", content: "你是具身智能评测的 AI 导演。为下一轮评测从算子表中选择 1 个扰动算子。严格只输出 JSON：{\"ops\":[\"shift|distract|tighten|slip 之一\"],\"reason\":\"≤28字理由\"}" },
            { role: "user", content: "任务：" + (S.task?.title || S.task?.nl || "") + "\n上一轮结果：" + (last ? last.filter((r) => r.outcome.status === "pass").length + "/3 通过，最弱 " + (roundSummaryOf(last).worst || "?") + "（" + (roundSummaryOf(last).reason || "") + "）" : "基础轮") + "\n记忆短板：\n" + (memLines || "（暂无）") + "\n剩余预算：" + S.budget + " 分（tighten=8 slip=12 shift=10 distract=15）" },
          ], { json: true, temp: 0.4, max: 120 });
          const j = extractJSON(out);
          if (j && Array.isArray(j.ops)) {
            const valid = j.ops.filter((o) => SIM_MOD.OP_NAMES.includes(o));
            const opDef = valid.map((n) => VARIANTS.ops.find((x) => x.name === n)).find(Boolean);
            if (opDef && opDef.cost <= S.budget) {
              ops = [opDef.name]; cost = opDef.cost;
              reason = "AI 导演：" + String(j.reason || opDef.label).slice(0, 40);
              label = opDef.label;
            }
          }
        } catch (e) { /* 降级离线算子表 */ }
      }
      if (!ops) {
        const d = SIM_MOD.deriveRoundOffline({ roundIdx, lastResults: S.lastResults, budgetLeft: S.budget, variantsCfg: VARIANTS, task: S.task, memNudge: memoryNudgeOp() });
        if (!d.ok) { w.deriveStop = d.reason; return; }
        ops = d.ops; cost = d.cost; reason = d.reason; label = d.label;
      }
      const applied = SIM_MOD.applyOps(S.spec, ops, SIM_MOD.mulberry32(SIM_MOD.runSeed(S.spec.seed, roundIdx)));
      w.pending = { roundIdx, ops, cost, reason, label, spec: applied.spec, log: applied.log,
        seed: SIM_MOD.runSeed(S.spec.seed, roundIdx) };
    },
  });
  S.sched.add({
    name: "确定性模拟", async tick(w) {
      if (!w.pending) return;
      const p = w.pending;
      const runIds = [];
      for (const pol of POLICIES.policies) {
        const r = SIM_MOD.runSim(p.spec, pol, p.seed);
        const id = "R" + (S.runs.length + 1);
        S.runs.push({ id, roundIdx: p.roundIdx, policyId: pol.id, variantLabel: p.roundIdx === 1 ? "基础轮" : p.label,
          spec: p.spec, policy: pol, seed: p.seed, frames: r.frames, hashes: r.hashes, outcome: r.outcome, total: r.total });
        runIds.push(id);
      }
      S.budget -= p.cost;
      const results = S.runs.slice(-3);
      S.lastResults = results;
      S.rounds.push({ idx: p.roundIdx, ops: p.ops, cost: p.cost, reason: p.reason, label: p.label, runIds,
        summary: SIM_MOD.roundSummary(results) });
      w.lastRuns = results;
      w.pending = null;
    },
  });
  S.sched.add({
    name: "记忆沉淀", async tick(w) {
      if (!w.lastRuns) return;
      const round = S.rounds[S.rounds.length - 1];
      for (const r of w.lastRuns) {
        S.mem.record(r.policyId, { turn: S.world.turn, day: 1, about: S.task.id,
          text: "【" + (r.outcome.status === "pass" ? "成功" : "失败") + "】#" + r.id + "@" + r.outcome.frame +
            " " + (r.roundIdx === 1 ? "基础轮" : round.label) + ":" + r.outcome.reason,
          imp: r.outcome.status === "fail" ? 4 : 2 });
      }
      const sum = SIM_MOD.roundSummary(w.lastRuns);
      S.mem.record("导演", { turn: S.world.turn, day: 1, about: S.task.id,
        text: "第" + round.idx + "轮" + (round.roundIdx === 1 ? "基础轮" : round.label) + ":" + sum.pass + "/3 通过" +
          (sum.pass < 3 ? "，最弱 " + (sum.worst || "?") : "，全员到位"),
        imp: 3 });
      w.lastRuns = null;
    },
  });
  /* 引擎 DirectorSystem（kernel.js:247）：仅在线挂载为节拍器；其离线 RULE_BEATS 是咖啡馆语料
     （kernel.js:235-242），不用于具身变体——离线变体走 app 层算子表（先例同款诚实绕行）。
     节拍进独立 MemoryStore，不污染策略轨迹线。 */
  if (providerReady) {
    S.director = new KERNEL_MOD.DirectorSystem(provider, new KERNEL_MOD.MemoryStore("game." + GAME.id + ".director.v1"), { interval: 1 });
  }
}
function roundSummaryOf(results) {
  const pass = results.filter((r) => r.outcome.status === "pass").length;
  const worstR = results.find((r) => r.outcome.status === "fail");
  return { pass, total: results.length, worst: worstR ? worstR.policyId : null, reason: worstR ? worstR.outcome.reason.slice(0, 18) : "" };
}
function extractJSON(s) { const m = (s || "").match(/\{[\s\S]*\}/); try { return m ? JSON.parse(m[0]) : null; } catch { return null; } }
/* 导演读记忆：召回失败片段 → 失败类型映射定向算子（碰倒→slip 逼低摩擦复测；超时→tighten 逼快） */
function memoryNudgeOp() {
  const sum = S.lastResults && roundSummaryOf(S.lastResults);
  if (!sum || !sum.worst) return null;
  const eps = S.mem.retrieve(sum.worst, S.task.id, "失败 碰倒 超时 掉桌", S.world.turn, 3);
  if (!eps.length) return null;
  const allFail = eps.every((e) => e.text.includes("失败"));
  if (!allFail) return null;
  if (eps.some((e) => e.text.includes("碰倒"))) return "slip";
  if (eps.some((e) => e.text.includes("超时"))) return "tighten";
  return null;
}
function directorMemoryLines(k) {
  const out = [];
  for (const a of S.mem.agents()) {
    if (a === "导演") continue;
    for (const e of S.mem.retrieve(a, S.task.id, "失败 碰倒 超时", S.world.turn, 1)) out.push(a + ":" + e.text.slice(0, 30));
  }
  return out.slice(0, k).join("\n");
}

/* ============ 评测编排 ============ */
async function evalRound() {
  if (S.busy || !S.spec) return false;
  const minCost = Math.min(...VARIANTS.ops.map((o) => o.cost));
  if (S.budget < minCost || S.rounds.length >= VARIANTS.budget.max_rounds) return false;
  S.busy = true; renderDirector("⏳ 变体派生→跑测→记忆沉淀 ……");
  S.world.deriveStop = null;
  if (S.director) { try { await S.director.tick(S.world); } catch (e) { /* 节拍静默 */ } }
  await S.sched.tick(S.world);
  S.busy = false;
  renderAll();
  return true;
}
async function evalAll() {
  if (S.busy) return;
  for (let i = 0; i < VARIANTS.budget.max_rounds + 1; i++) {
    const more = await evalRound();
    if (!more) break;
  }
}
function loadRun(id, frameIdx) {
  const run = S.runs.find((r) => r.id === id); if (!run) return;
  S.play.run = run; S.play.frame = Math.min(frameIdx ?? 0, run.total - 1); S.play.playing = false;
  buildObjects(run.spec);
  $("playbar").classList.add("on");
  $("pb-run").textContent = run.id + "·" + policyName(run.policyId) + "·" + run.variantLabel;
  $("pb-slider").max = run.total - 1;
  switchTab("runs");
  poseFromFrame(); syncPlaybar(); renderRuns();
  const o = run.outcome;
  $("pb-hash").innerHTML = (o.status === "pass" ? '<span class="verify-ok">✓ ' : '<span class="verify-bad">✗ ') +
    esc(o.reason) + "</span> @" + o.frame;
}
function policyName(id) { return (POLICIES.policies.find((p) => p.id === id) || {}).name || id; }
function syncPlaybar() {
  const run = S.play.run; if (!run) return;
  $("pb-slider").value = S.play.frame;
  $("pb-frame").textContent = S.play.frame + "/" + (run.total - 1);
  $("pb-hash").textContent = "帧哈希 " + (run.hashes[S.play.frame] || "—");
  drawStrip();
}
function verifyCurrent() {
  const run = S.play.run; if (!run) return;
  const v = SIM_MOD.verifyReplay(run);
  const el = $("hud-verify");
  if (v.ok) {
    el.innerHTML = '<span class="verify-ok">帧校验 一手不差 ✓</span>';
    $("pb-hash").innerHTML = '<span class="verify-ok">🔁 复演一手不差 ✓ ' + v.match + "/" + v.total +
      " 帧哈希全同</span>（重放 " + v.ms + "ms，轨迹 " + JSON.stringify(run.frames).length + " 字节逐字节一致）";
  } else {
    el.innerHTML = '<span class="verify-bad">帧校验 复现破损 ✗</span>';
    $("pb-hash").innerHTML = '<span class="verify-bad">✗ 首个不一致帧 #' + v.firstBad + "</span>（" + v.match + "/" + v.total + "）";
  }
}

/* ============ 轨迹小地图（点击跳帧） ============ */
function drawStrip() {
  const cv = $("strip"); if (!cv) return;
  const run = S.play.run;
  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!run) return;
  const spec = run.spec;
  const sx = (cv.width - 24) / spec.table.w, sz = (cv.height - 24) / spec.table.h;
  const sc = Math.min(sx, sz);
  const X = (x) => cv.width / 2 + x * sc, Z = (z) => cv.height / 2 + z * sc;
  ctx.strokeStyle = "#1e2536"; ctx.strokeRect(X(-spec.table.w / 2), Z(-spec.table.h / 2), spec.table.w * sc, spec.table.h * sc);
  ctx.strokeStyle = "#2d5b9e"; ctx.beginPath();
  for (let i = 0; i < run.frames.length; i += 8) {
    const f = run.frames[i];
    i === 0 ? ctx.moveTo(X(f.rx), Z(f.rz)) : ctx.lineTo(X(f.rx), Z(f.rz));
  }
  ctx.stroke();
  const dp = spec.objects.find((o) => o.id === spec.goal.dest);
  if (dp) { ctx.strokeStyle = "#e8b24e"; ctx.beginPath(); ctx.arc(X(dp.x), Z(dp.y), dp.r * sc, 0, 7); ctx.stroke(); }
  const f = run.frames[S.play.frame];
  if (f) { ctx.fillStyle = "#57d98d"; ctx.beginPath(); ctx.arc(X(f.rx), Z(f.rz), 4, 0, 7); ctx.fill(); }
  cv.onclick = (e) => {
    const rect = cv.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (cv.width / rect.width), mz = (e.clientY - rect.top) * (cv.height / rect.height);
    let best = 0, bd = Infinity;
    for (let i = 0; i < run.frames.length; i += 4) {
      const fr = run.frames[i];
      const d = Math.hypot(X(fr.rx) - mx, Z(fr.rz) - mz);
      if (d < bd) { bd = d; best = i; }
    }
    S.play.frame = best; poseFromFrame(); syncPlaybar();
  };
}

/* ============ 出题 ============ */
function setTask(task, notes) {
  S.task = task; S.spec = JSON.parse(JSON.stringify(task.spec));
  S.rounds = []; S.runs = []; S.budget = VARIANTS.budget.initial_points;

  renderAll();

}
async function deriveFromNL() {
  const nl = $("nl").value.trim(); if (!nl) return;
  if (!providerReady) {
    const m = SIM_MOD.matchTaskOffline(nl, TASKS.tasks);
    if (m) { setTask(m.task, ["〔离线匹配〕命中关键词「" + m.hit.join("、") + "」→ 任务库卡片「" + m.task.title + "」（评分 " + m.score + "）"]); }
    else setTask(TASKS.tasks[0], ["〔离线匹配〕未命中任务库句式 → 落到预置任务「" + TASKS.tasks[0].title + "」。联网后 AI 出题可解析任意句。"]);
    return;
  }
  $("dir-status").innerHTML = '<span class="thinking">🤖 L7 正在解析场景卡……</span>';
  try {
    const fewshot = TASKS.tasks.slice(0, 2).map((t) => JSON.stringify({ table: t.spec.table, objects: t.spec.objects, goal: t.spec.goal, constraints: t.spec.constraints, title: t.title })).join("\n");
    const out = await provider.complete([
      { role: "system", content: "你是具身智能评测的出题引擎：把一句自然语言桌面操作任务解析为场景卡 JSON。严格只输出 JSON：" +
        '{"table":{"w":10,"h":6},"objects":[{"id":"red_cup","type":"cup|bottle|box|can|coaster|pad 之一","color":"red|blue|green|yellow|white|gray|brown|purple 之一","x":-2.5,"y":0,"r":0.35,"fragile":false}],"goal":{"verb":"push","target":"目标物id","dest":"目的地id","tol":0.5},"constraints":["no_topple","stay_on_table"],"title":"≤12字任务名","note":"≤30字出题说明"}' +
        "\n规则：桌面为 x∈[-5,5]、y∈[-3,3]；至少一个可推目标物和一个 coaster/pad 目的地；fragile 物体 ≤2 个；物体间距≥1.2；至少 1 个约束物才有评测意义。\n任务库示例（few-shot）：\n" + fewshot },
      { role: "user", content: "任务：「" + nl + "」" },
    ], { json: true, temp: 0.3, max: 420 });
    const j = extractJSON(out);
    if (!j) throw new Error("模型未返回 JSON");
    const n = SIM_MOD.normalizeCard(j);
    if (!n.ok) throw new Error(n.reason);
    n.card.title = n.card.title || nl.slice(0, 12);
    setTask(n.card, ["〔AI 出题〕场景卡已生成" + (n.note ? "：" + n.note : "")].concat(n.notes || []).concat([j.note ? "出题说明：" + j.note : ""]).filter(Boolean));
  } catch (e) {
    const m = SIM_MOD.matchTaskOffline(nl, TASKS.tasks);
    const fallbackNote = "〔AI 出题失败：" + String(e.message || e).slice(0, 60) + " → 已降级任务库匹配〕";
    if (m) setTask(m.task, [fallbackNote, "命中「" + m.hit.join("、") + "」→ " + m.task.title]);
    else setTask(TASKS.tasks[0], [fallbackNote, "未命中句式 → 落到预置任务"]);
  }
}

/* ============ 记忆检索 ============ */
function memSearch(q) {
  const now = S.world.turn;
  const out = [];
  for (const a of S.mem.agents()) {
    for (const e of S.mem.retrieve(a, q, q, now, 4)) out.push({ agent: a, e });
  }
  const seen = new Set();
  return out.filter((x) => { const k = x.agent + "|" + x.e.text; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 8);
}
function renderMemory(q) {
  const res = memSearch(q);
  $("mem-stat").textContent = "长期记忆 " + S.mem.lenTotal() + " 条 / " + S.mem.agents().length + " 条线（每线引擎上限 60 条，kernel.js:25）——检索为引擎 MemoryStore.retrieve 真实调用";
  $("mem-view").innerHTML = res.length ? res.map((r) => {
    const m = r.e.text.match(/#(R\d+)@(\d+)/);
    const jump = m && S.runs.some((x) => x.id === m[1])
      ? '<button class="go" data-run="' + m[1] + '" data-f="' + m[2] + '">▶ 跳到 ' + m[1] + " 第" + m[2] + "帧</button>" : "";
    return '<div class="memrow"><span class="who">' + esc(policyName(r.agent)) + "</span>：" + esc(r.e.text) + jump + "</div>";
  }).join("") : '<div class="hint">（无召回——先去「导演」页跑几轮评测，成功/失败片段会按策略线沉淀到这里）</div>';
  $("mem-view").querySelectorAll(".go").forEach((b) => {
    b.onclick = () => { loadRun(b.dataset.run, +b.dataset.f); };
  });
}

/* ============ 渲染 ============ */
function renderAll() { renderHUD(); renderTaskChips(); renderCard(); renderDirector(); renderRounds(); renderRuns(); renderCodex(); renderMemory($("mem-q").value.trim() || "失败"); drawStrip(); }
function renderHUD() {
  $("tagline").textContent = GAME.tagline.slice(0, 26) + "…";
  $("hud-task").textContent = S.task ? S.task.title : "—";
  $("hud-seed").textContent = S.spec ? S.spec.seed : "—";
  $("hud-budget").textContent = S.budget;
  $("budget-big").textContent = S.budget;
  const pass = S.runs.filter((r) => r.outcome.status === "pass").length;
  $("hud-pass").textContent = pass + "/" + S.runs.length;
  $("hud-mem").textContent = S.mem ? S.mem.lenTotal() : 0;
}
function renderTaskChips() {
  $("task-chips").innerHTML = TASKS.tasks.map((t, i) =>
    '<button data-i="' + i + '" class="' + (S.task && S.task.id === t.id ? "sel" : "") + '">' + esc(t.title) + "</button>").join("");
  $("task-chips").querySelectorAll("button").forEach((b) => {
    b.onclick = () => setTask(TASKS.tasks[+b.dataset.i]);
  });
}
function renderCard() {
  const el = $("card-view");
  if (!S.spec) { el.innerHTML = ""; return; }
  const s = S.spec, g = s.goal;
  const tp = s.objects.find((o) => o.id === g.target), dp = s.objects.find((o) => o.id === g.dest);
  el.innerHTML =
    '<div class="card"><b class="tt">场景卡 · ' + esc(S.task.title || "") + '</b>' +
    '<div class="dim">种子 ' + s.seed + " · 桌面 " + s.table.w + "×" + s.table.h + " · 容差 " + g.tol +
    (s.slipLevel ? " · 打滑 L" + s.slipLevel : "") + "</div>" +
    s.objects.map((o) => '<div class="objline"><span class="objdot" style="background:#' +
      (COLOR_HEX[o.color] ?? 0x888888).toString(16).padStart(6, "0") + '"></span>' + esc(o.id) +
      ' <span class="dim">' + o.type + " (" + o.x + ", " + o.y + ") r=" + o.r + "</span>" +
      (o.fragile ? '<span class="frag">易碎</span>' : "") +
      (o.id === g.target ? ' <span style="color:#7eb8ff">◈目标</span>' : "") +
      (o.id === g.dest ? ' <span style="color:#e8b24e">◉目的地</span>' : "") + "</div>").join("") +
    '<div class="dim" style="margin-top:4px">目标：' + (g.verb === "push" ? "推" : g.verb) + " " + esc(tp ? tp.id : g.target) +
      " → " + esc(dp ? dp.id : g.dest) + "（距 " + (tp && dp ? Math.hypot(tp.x - dp.x, tp.y - dp.y).toFixed(1) : "?") + "）· 约束 " + s.constraints.map(esc).join(" / ") + "</div>" +
    '<div class="row" style="margin:8px 0 0"><button class="act dim3" id="btn-reseed" style="padding:5px 10px;font-size:12px">🎲 换种子重摆</button></div></div>';
  $("btn-reseed").onclick = () => {
    S.spec.seed = (SIM_MOD.fnv1a(S.spec.seed + ":" + Date.now()) ^ 0x9e37) >>> 0;
    S.rounds = []; S.runs = []; S.budget = VARIANTS.budget.initial_points; S.lastResults = null;
    S.play = { run: null, frame: 0, playing: false, speed: 6 };
    $("playbar").classList.remove("on");
    buildObjects(S.spec); renderAll();
  };
}
function renderDirector(statusText) {
  $("budget-rule").textContent = "初始 " + VARIANTS.budget.initial_points + " 分 · 基础轮免费 · 算子价目 " +
    VARIANTS.ops.map((o) => o.label + " " + o.cost).join(" / ") + " · 最多 " + VARIANTS.budget.max_rounds + " 轮";
  if (statusText) $("dir-status").innerHTML = '<span class="thinking">' + statusText + "</span>";
  else if (!S.rounds.length) $("dir-status").innerHTML = S.world && S.world.deriveStop
    ? "（" + esc(S.world.deriveStop) + "）" : "点「一键评测」：基础轮 3 策略免费跑 → 导演按预算逐轮派生扰动变体（失败轮走复测优先级）。";
  else $("dir-status").textContent = "";
  const beats = (S.world && S.world.story.beats) || [];
  $("beat-view").innerHTML = beats.length
    ? beats.slice(-2).map((b) => '<div class="beatline">🎬 引擎导演节拍：' + esc(b) + "</div>").join("")
    : (providerReady ? "" : '<div class="hint">引擎 DirectorSystem 节拍通道仅在线挂载（其离线 RULE_BEATS 为咖啡馆语料，不用于具身变体——离线派生走 app 层算子表）。</div>');
}
function renderRounds() {
  $("rounds-view").innerHTML = S.rounds.map((r) => {
    const runs = r.runIds.map((id) => S.runs.find((x) => x.id === id));
    return '<div class="card roundcard"><b class="tt">第 ' + r.idx + " 轮 · " + (r.idx === 1 ? "基础轮" : esc(r.label)) +
      "</b> <span class=\"dim\">−" + r.cost + " 分</span><br>" +
      '<span class="dim">' + esc(r.reason) + "</span><br>" +
      runs.map((run) => '<a href="javascript:void(0)" data-run="' + run.id + '" style="color:#7eb8ff;text-decoration:none;margin-right:8px">' +
        esc(policyName(run.policyId)) + " " + badgeOf(run.outcome) + "</a>").join("") + "</div>";
  }).join("");
  $("rounds-view").querySelectorAll("a[data-run]").forEach((a) => { a.onclick = () => loadRun(a.dataset.run, 0); });
}
function renderRuns() {
  const el = $("runs-table");
  if (!S.runs.length) { el.innerHTML = '<tr><td class="hint">尚无跑测——先去「导演」页评测。</td></tr>'; $("run-detail").innerHTML = ""; return; }
  el.innerHTML = "<tr><th>跑测</th><th>轮次</th><th>策略</th><th>结果</th><th>帧</th></tr>" +
    S.runs.slice().reverse().map((r) =>
      '<tr class="runrow ' + (S.play.run && S.play.run.id === r.id ? "sel" : "") + '" data-run="' + r.id + '"><td>' + r.id +
      "</td><td>" + r.roundIdx + (r.roundIdx === 1 ? "（基础）" : "·" + esc(r.variantLabel)) + "</td><td>" + esc(policyName(r.policyId)) +
      "</td><td>" + badgeOf(r.outcome) + '</td><td class="dim">' + r.total + "</td></tr>").join("");
  el.querySelectorAll(".runrow").forEach((tr) => { tr.onclick = () => loadRun(tr.dataset.run, 0); });
}
const doneSteps = new Set();
function renderCodex() {
  const el = $("page-codex");
  let html = "<h4 style='color:#9fc3ff;font-size:13px;margin-bottom:8px'>核心循环（点条勾进度）</h4>";
  GAME.core_loop.forEach((s, i) => {
    html += '<div class="loop-step ' + (doneSteps.has(i) ? "done" : "") + '" data-i="' + i + '">' +
      "<span>" + (doneSteps.has(i) ? "✅" : "▫️") + "</span>" + esc(s) + "</div>";
  });
  html += "<h4 style='color:#9fc3ff;font-size:13px;margin:10px 0 8px'>机制系统</h4>";
  GAME.mechanics.forEach((m) => { html += '<div class="mech"><b>' + esc(m.name) + "</b><div>" + esc(m.detail) + "</div></div>"; });
  html += "<h4 style='color:#9fc3ff;font-size:13px;margin:10px 0 8px'>经济循环</h4><table class='grid'><tr><th>资源</th><th>来源</th><th>去向</th></tr>";
  GAME.economy.forEach((r) => { html += "<tr><td>" + esc(r.name) + "</td><td>" + esc(r.source) + "</td><td>" + esc(r.sink) + "</td></tr>"; });
  html += "</table><h4 style='color:#9fc3ff;font-size:13px;margin:10px 0 8px'>难度曲线</h4><div class='mech'><div>" + esc(GAME.difficulty) + "</div></div>";
  html += "<h4 style='color:#9fc3ff;font-size:13px;margin:10px 0 8px'>引擎钩子与诚实边界</h4>";
  (GAME.track.hooks.engine || []).forEach((h) => { html += '<div class="mech"><div>🔗 ' + esc(h) + "</div></div>"; });
  (GAME.track.hooks.honesty || []).forEach((h) => { html += '<div class="mech"><div>⚠️ ' + esc(h) + "</div></div>"; });
  el.innerHTML = html;
  el.querySelectorAll(".loop-step").forEach((d) => {
    d.onclick = () => { const i = +d.dataset.i; doneSteps.has(i) ? doneSteps.delete(i) : doneSteps.add(i); renderCodex(); };
  });
}

/* ============ 事件接线 ============ */
function switchTab(t) {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
  document.querySelectorAll(".tab-page").forEach((p) => p.classList.remove("on"));
  $("page-" + t).classList.add("on");
}
function wireUI() {
  document.querySelectorAll("#tabs button").forEach((b) => { b.onclick = () => switchTab(b.dataset.t); });
  $("btn-nl-off").onclick = deriveFromNL;
  $("btn-nl-ai").onclick = deriveFromNL;
  $("nl").addEventListener("keydown", (e) => { if (e.key === "Enter") deriveFromNL(); });
  if (!providerReady) { $("btn-nl-ai").disabled = true; $("btn-nl-ai").title = "离线模式——切在线见 provider.json / README"; }
  $("btn-runall").onclick = evalAll;
  $("btn-round").onclick = () => evalRound();
  $("pb-play").onclick = () => { if (!S.play.run) return; S.play.playing = !S.play.playing;
    $("pb-play").textContent = S.play.playing ? "⏸ 暂停" : "▶ 播放";
    if (S.play.playing && S.play.frame >= S.play.run.total - 1) { S.play.frame = 0; } };
  $("pb-slider").oninput = (e) => { S.play.frame = +e.target.value; S.play.playing = false; $("pb-play").textContent = "▶ 播放"; poseFromFrame(); syncPlaybar(); };
  $("pb-verify").onclick = verifyCurrent;
  $("btn-mem-go").onclick = () => renderMemory($("mem-q").value.trim());
  $("mem-q").addEventListener("keydown", (e) => { if (e.key === "Enter") renderMemory($("mem-q").value.trim()); });
  $("mem-chips").innerHTML = ["碰倒瓶子的失败", "超时", "绕行型", "导演"].map((q) => "<button>" + q + "</button>").join("");
  $("mem-chips").querySelectorAll("button").forEach((b) => { b.onclick = () => { $("mem-q").value = b.textContent; renderMemory(b.textContent); }; });
  $("btn-export").onclick = () => {
    const blob = new Blob([S.mem.export()], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "embodied-dataset-" + GAME.id + ".json"; a.click();
    URL.revokeObjectURL(a.href);
  };
  $("btn-mem-clear").onclick = () => { S.mem.clear(); renderAll(); };
}

/* ============ 启动 ============ */
async function start() {
  await buildScene();
  wireEngine();
  wireUI();
  const savedId = JSON.parse(localStorage.getItem("game." + GAME.id + ".task") || "null");
  const t0 = TASKS.tasks.find((t) => t.id === savedId) || TASKS.tasks[0];
  setTask(t0);
  renderMemory("失败");
  drawStrip();
}
boot();
</script>
</body>
</html>
