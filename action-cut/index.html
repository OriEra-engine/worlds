const savedCfg = JSON.parse(localStorage.getItem("aicafe.llm.v1") || "null");
async function boot() {
  try { mod = await import(KERNEL); }
  catch (e) { document.getElementById("fallback").style.display = "flex"; return; }
  try { SB = await import("./app/storyboard.js"); }
  catch (e) { document.getElementById("fallback").style.display = "flex"; return; }
  if (savedCfg && savedCfg.key && savedCfg.kind !== "rule") {
    provider = mod.createProvider(savedCfg);
    providerReady = !!(provider && provider.ready);
  }
  if (providerReady) {
    document.getElementById("prov-name").textContent = (savedCfg.model || "llm") + "（引擎 L7 · AI 已植入）";
    document.getElementById("dot").classList.add("live");
  }
  await startApp();
}

/* ============ 常量与持久化状态 ============ */
const PAL = ["#e8b24e", "#7eb8ff", "#7effc3"];          /* 角色卡固定识别色（按下标分配） */
const CREW_COLOR = ["#e8b24e", "#7eb8ff", "#7effc3", "#ff8fb3"];
const FILM0 = 24, CARD_W = 480, CARD_H = 270;
const KEY = "game." + GAME.id + ".";
function freshState() {
  return { order: "", project: null, shots: [], reel: [], film: FILM0, spent: 0,
    reusedTotal: 0, takes: 0, turn: 0, cur: 0, ctx: null, verified: false,
    premiered: false, archived: false, lowWarned: false, flags: {}, log: [] };
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY + "state.v1"));
    if (s && typeof s === "object" && "project" in s) return Object.assign(freshState(), s, { flags: {} });
  } catch (e) {}
  return freshState();
}
let S = loadState();
function saveState() { localStorage.setItem(KEY + "state.v1", JSON.stringify(S)); }
const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function log(who, text) {
  S.log.push({ who, text });
  if (S.log.length > 120) S.log.splice(0, S.log.length - 120);
}
function extractJSONLoose(s) { const m = (s || "").match(/\{[\s\S]*\}/); try { return m ? JSON.parse(m[0]) : null; } catch { return null; } }

/* ============ 引擎服务：片库记忆 + 系统调度 ============ */
async function startApp() {
  const mem = new mod.MemoryStore(KEY + "mem.v1");
  const THREE = await import("three");
  const { OrbitControls } = await import(VENDOR_BASE + "OrbitControls.js");
  const { GLTFLoader } = await import(VENDOR_BASE + "GLTFLoader.js");

  /* ---- 3D 片场舞台（dungeon 黑金调，crew 机器人） ---- */
  const sceneEl = document.getElementById("scene");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(sceneEl.clientWidth, sceneEl.clientHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  sceneEl.insertBefore(renderer.domElement, sceneEl.firstChild);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0d12);
  scene.fog = new THREE.Fog(0x0a0d12, 18, 55);
  const camera = new THREE.PerspectiveCamera(50, sceneEl.clientWidth / sceneEl.clientHeight, 0.1, 200);
  camera.position.set(0, 6, 14);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.2, 0);
  controls.enableDamping = true; controls.maxPolarAngle = Math.PI / 2.05;
  controls.minDistance = 6; controls.maxDistance = 30;
  const hemi = new THREE.HemisphereLight(0x5a6b8e, 0x0e1116, 1.1); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xff9a4d, 1.6); sun.position.set(6, 10, 4); scene.add(sun);
  const ground = new THREE.Mesh(new THREE.CircleGeometry(16, 48).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: 0x161c26, roughness: .95 }));
  scene.add(ground);
  const ring = new THREE.Mesh(new THREE.RingGeometry(15.4, 16, 64).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0x8a5a2e, transparent: true, opacity: .5 }));
  scene.add(ring);
  const crew = [];
  const loader = new GLTFLoader();
  const gltf = await loader.loadAsync(VENDOR_BASE + "RobotExpressive.glb");
  AGENTS.forEach((a, i) => {
    const root = gltf.scene.clone(true);
    root.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.color.multiplyScalar(1); } });
    const angle = (i / Math.max(AGENTS.length, 1)) * Math.PI * 2;
    root.position.set(Math.cos(angle) * 5, 0, Math.sin(angle) * 5);
    root.lookAt(0, 0, 0);
    root.userData = { index: i };
    scene.add(root);
    const cv = document.createElement("canvas"); cv.width = 256; cv.height = 72;
    const cx = cv.getContext("2d");
    cx.fillStyle = "rgba(13,16,23,.85)";
    cx.beginPath(); cx.moveTo(18, 6); cx.arcTo(250, 6, 250, 60, 14); cx.arcTo(250, 60, 6, 60, 14);
    cx.arcTo(6, 60, 6, 6, 14); cx.arcTo(6, 6, 250, 6, 14); cx.closePath(); cx.fill();
    cx.fillStyle = CREW_COLOR[i % CREW_COLOR.length];
    cx.font = "bold 30px sans-serif"; cx.textAlign = "center";
    cx.fillText(a.name, 128, 46);
    const label = new THREE.Sprite(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(cv), depthTest: false, transparent: true }));
    label.scale.set(2.2, 0.62, 1); label.position.set(root.position.x, 3.1, root.position.z);
    scene.add(label);
    let mixer = null;
    try {
      mixer = new THREE.AnimationMixer(root);
      const idle = gltf.animations.find(x => /idle/i.test(x.name)) || gltf.animations[0];
      if (idle) mixer.clipAction(idle).play();
    } catch (e) {}
    crew.push({ agent: a, root, label, mixer, gltfAnims: gltf.animations });
  });
  function playClipAll(name) {
    crew.forEach(n => {
      if (!n.mixer || !n.gltfAnims) return;
      const clip = n.gltfAnims.find(c => c.name === name) || n.gltfAnims.find(c => new RegExp(name, "i").test(c.name));
      if (!clip) return;
      n.mixer.stopAllAction(); n.mixer.clipAction(clip).reset().play();
    });
  }
  const clock = new THREE.Clock();
  (function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    crew.forEach((n, j) => {
      n.label.position.y = 3.1 + Math.sin(clock.elapsedTime * 2 + j) * 0.06;
      if (n.mixer) n.mixer.update(dt);
    });
    controls.update();
    renderer.render(scene, camera);
  })();
  window.addEventListener("resize", () => {
    camera.aspect = sceneEl.clientWidth / sceneEl.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(sceneEl.clientWidth, sceneEl.clientHeight);
  });

  /* ================= 应用层三系统（引擎 Scheduler 串联，一次生产一 tick） ================= */
  function castArr() { return S.project ? S.project.characters : []; }
  function specView(shot) { return Object.assign({}, shot.spec, { __style: S.project.style }); }
  function buildCtx(i) {
    const shot = S.shots[i]; if (!shot) return null;
    const q = (S.project.characters.map(c => c.name + c.desc).join("")) + shot.spec["出场角色"].join("") + shot.spec["画面"];
    const cast = mem.retrieve("filmset", "cast", q, S.turn, 3);
    const locked = mem.retrieve("filmset", "locked", q, S.turn, 4);
    /* 检索按评分排序（about 只加成不过滤），两条通道按各自 about 收口，
       保证 🎭=角色卡、🔒=已定稿镜头 语义不串档 */
    return { cast: cast.filter(e => e.about === "cast").map(e => e.text),
      locked: locked.filter(e => e.about === "locked").map(e => e.text) };
  }
  const directorSys = { name: "directorSys", async tick(w) {
    if (w.flags.recreate) {
      w.flags.recreate = false;
      if (providerReady) await aiRecreate(w);
      else { log("咔", "离线片场——改机位通道静默，用「重抽·换种子」出变体。"); w.flags.draw = { mode: "fresh" }; }
    }
    if (w.flags.open) {
      w.flags.open = false;
      w.ctx = buildCtx(w.cur);
      const s = S.shots[w.cur];
      if (s) log("墨格", `第${w.cur + 1}镜开拍前检索：角色卡 ×${w.ctx.cast.length} · 已定稿镜头 ×${w.ctx.locked.length}（注入导演上下文，imp×0.45+aboutBonus 1.2 定稿镜头排前）`);
    }
  }};
  const drawSys = { name: "drawSys", async tick(w) {
    if (w.flags.draw) { const o = w.flags.draw; w.flags.draw = null; doDraw(o); }
  }};
  const lockSys = { name: "lockSys", async tick(w) {
    if (w.flags.lock) { w.flags.lock = false; doLock(); }
  }};
  const sched = new mod.Scheduler();
  sched.add(directorSys); sched.add(drawSys); sched.add(lockSys);
  async function pump() { S.turn++; await sched.tick(S); renderAll(); saveState(); }

  /* ================= ① 一句开机：拆解 ================= */
  const orderInput = document.getElementById("order");
  document.getElementById("tpl-chips").innerHTML =
    STORY.offlineTemplates.map((t, i) => `<span data-i="${i}">${esc(t.genre)}</span>`).join("");
  document.querySelectorAll("#tpl-chips span").forEach(sp => sp.onclick = () => {
    orderInput.value = "拍一段" + STORY.offlineTemplates[+sp.dataset.i].genre + "题材的两分钟短片";
  });
  document.getElementById("btn-boot").onclick = async () => {
    const order = orderInput.value.trim() || "拍一段雨夜追逃的两分钟短片";
    const btn = document.getElementById("btn-boot");
    btn.disabled = true; btn.textContent = "导演拆本中……";
    S.order = order;
    if (providerReady) await aiDecompose(order);
    else offlineDecompose(order);
    btn.disabled = false; btn.textContent = "开机！";
    if (S.project) { S.flags.open = true; await pump(); }
  };
  orderInput.addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("btn-boot").click(); });

  function directorSysPrompt(extra) {
    const a = AGENTS[0];
    return `你在一场名为「${GAME.name}」的游戏原型里扮演片场 crew。
角色：${a.name}（${a.role}），人设：${a.persona}
世界观前提：${STORY.premise}
${extra || ""}
（现在执行拆解：严格按人设中的【拆解·输出协议】只输出一个 JSON 对象，不输出任何其他文字。）`;
  }
  async function aiDecompose(order) {
    log("咔", `拍片令收到：「${order}」——拆本中。`);
    try {
      const out = await provider.complete([
        { role: "system", content: directorSysPrompt() },
        { role: "user", content: `制片拍片令：「${order}」\n拆解为 {title, style, characters(1~3), shots(6~8)}，只输出 JSON。` }
      ], { json: true, temp: 0.8, max: 1300 });
      const j = extractJSONLoose(out);
      const pr = sanitizeProject(j, order);
      if (!pr) { log("咔", "拆本格式不合格——退回模板库照拍。"); offlineDecompose(order); return; }
      applyProject(pr, "AI 导演拆解");
    } catch (e) {
      log("咔", `模型调用失败（${String(e.message || e).slice(0, 40)}）——退回模板库照拍。`);
      offlineDecompose(order);
    }
  }
  function offlineDecompose(order) {
    let best = null, bestHits = -1;
    for (const t of STORY.offlineTemplates) {
      const hits = t.keywords.reduce((a, k) => a + (order.includes(k) ? 1 : 0), 0);
      if (hits > bestHits) { bestHits = hits; best = t; }
    }
    const pr = {
      project: { title: best.title, style: best.style, characters: best.characters.map((c, i) => ({
        name: c.name, tag: c.tag, desc: c.desc, color: PAL[i] })) },
      shots: best.shots.map(s => ({ spec: SB.normSpec(s), status: "pending", variants: [], locked: null })),
    };
    applyProject(pr, `离线模板·关键词匹配「${best.genre}」（命中 ${bestHits} 词）`);
  }
  function sanitizeProject(j, order) {
    if (!j || typeof j !== "object") return null;
    const title = String(j.title || "").slice(0, 16).trim(); if (!title) return null;
    const style = String(j.style || "未注明影调").slice(0, 40);
    const characters = (Array.isArray(j.characters) ? j.characters : []).slice(0, 3).map((c, i) => ({
      name: String((c && c.name) || ("角色" + (i + 1))).slice(0, 8),
      tag: String((c && (c.tag || c.role)) || "").slice(0, 12),
      desc: String((c && c.desc) || "").slice(0, 60), color: PAL[i] }));
    if (!characters.length) return null;
    const rawShots = Array.isArray(j.shots) ? j.shots : [];
    const shots = rawShots.map(s => {
      if (!s || typeof s !== "object") return null;
      const spec = SB.normSpec({
        "景别": s["景别"] || s.shot || s.景别, "机位": s["机位"] || s.angle, "运镜": s["运镜"] || s.move,
        "画面": s["画面"] || s.desc || s.screen, "出场角色": s["出场角色"] || s.cast || s.characters || [],
        "天气": s["天气"] || s.weather, "时段": s["时段"] || s.time });
      spec["出场角色"] = spec["出场角色"].filter(n => characters.some(c => c.name === n));
      return { spec, status: "pending", variants: [], locked: null };
    }).filter(Boolean);
    if (shots.length > 8) shots.length = 8;   /* 协议上限 8 镜，超出截断 */
    if (shots.length < 6) return null;
    return { project: { title, style, characters }, shots };
  }
  function applyProject(pr, src) {
    S.project = pr.project; S.shots = pr.shots; S.reel = []; S.cur = 0;
    S.film = FILM0; S.spent = 0; S.reusedTotal = 0; S.takes = 0;
    S.verified = false; S.premiered = false; S.archived = false; S.lowWarned = false;
    const p = S.project;
    p.characters.forEach(c => mem.record("filmset",
      { turn: S.turn, about: "cast", text: `角色卡·${c.name}（${c.tag}）${c.desc}——识别色 ${c.color}`, imp: 9 }));
    mem.record("filmset", { turn: S.turn, about: "script",
      text: `剧本·「${p.title}」影调 ${p.style}·卡司 ${p.characters.map(c => c.name).join("/")}·${S.shots.length} 镜——${S.order}`, imp: 8 });
    log("咔", `「${p.title}」——${S.shots.length} 镜，影调：${p.style}。三分钟内开机！`);
    log("墨格", `确定性摄影机就位（${providerReady ? "AI 导演在线" : "规则引擎（离线）"}），种子表已贴。`);
    log("回放", `片库开档（${mem.lenTotal()} 条记忆）：角色卡 about=cast ×${p.characters.length}，剧本 about=script ×1。`);
    log("系统", `本片来源：${src}`);
  }

  /* ================= ② 逐镜抽卡 ================= */
  /* 展示绘制：落到传入画布（可为 in-DOM #card）。 */
  function renderCard(canvas, shot, variant, idx) {
    const L = SB.computeLayout(specView(shot), variant.seed, variant.ref == null ? null : variant.ref, castArr());
    L.idx = idx + 1;
    SB.paintLayout(canvas, L);
    return L;
  }
  /* 对账双凭证：
     · 布局摘要 hashLayout(L) —— 纯数学参数凭证，跨画布/跨时间稳定（mulberry32 保证）；
     · 像素哈希 hashCanvas —— 固定落离屏画布：in-DOM 画布走合成器光栅路径，跨时刻
       偶有环境噪点，离屏同 (spec×seed×cast) 逐像素稳定。重放对账双证齐验。 */
  function frameCreds(shot, variant, idx) {
    const L = renderCard(document.createElement("canvas"), shot, variant, idx);
    const hcv = document.createElement("canvas");
    hcv.width = CARD_W; hcv.height = CARD_H;
    SB.paintLayout(hcv, L);
    return { pixel: SB.hashCanvas(hcv), layout: SB.hashLayout(L) };
  }
  function doDraw(opts) {
    const shot = S.shots[S.cur];
    if (!shot || shot.status === "locked") return;
    let seed = (Math.random() * 0x7fffffff) | 0, ref = null;
    if (opts.mode === "reuse") {
      const r = S.shots[opts.ref];
      if (!r || r.status !== "locked") return;
      ref = r.locked.seed;
      S.reusedTotal++;
      log("墨格", `复用第${opts.ref + 1}镜参考帧——构图面继承 seed ${SB.hex8(ref)}（天际线/站位/光源不变），本卡运气 seed 另掷，胶片未动。`);
    } else {
      if (S.film < 1) { log("咔", `胶片只剩 ${S.film} 卷——要么定稿，要么免费复用参考帧。`); return; }
      S.film--; S.spent++;
    }
    const cv = document.getElementById("card");
    const v = { seed, ref, ver: shot.variants.length + 1, hash: null, ld: null };
    renderCard(cv, shot, v, S.cur);
    const creds = frameCreds(shot, v, S.cur);
    v.hash = creds.pixel; v.ld = creds.layout;
    shot.variants.push(v);
    S.takes++;
    const modeTxt = opts.mode === "reuse" ? "复用参考帧" : opts.mode === "ai" ? "AI 改机位后新卡" : (v.ver === 1 ? "抽卡" : "重抽变体");
    log("墨格", `第${S.cur + 1}镜 take ${v.ver}（${modeTxt}）：seed ${SB.hex8(seed)}${ref != null ? " · ref " + SB.hex8(ref) : ""} · 帧 ${v.hash}。`);
    if (!S.lowWarned && S.film <= 8) {
      S.lowWarned = true;
      log("咔", `预算危机：胶片剩 ${S.film} 卷。别烧卷抽卡了——复用参考帧免费，而且更一致。`);
    }
    playClipAll("Wave");
  }
  async function aiRecreate(w) {
    const shot = S.shots[w.cur]; if (!shot || shot.status === "locked") { w.flags.draw = { mode: "fresh" }; return; }
    log("咔", "改机位：导演看片后重写本镜参数……");
    const ctx = w.ctx || buildCtx(w.cur) || { cast: [], locked: [] };
    try {
      const out = await provider.complete([
        { role: "system", content: directorSysPrompt(`改机位模式：只输出 shots[0] 一个镜头对象的同式 JSON。`) },
        { role: "user", content: `重拍第${w.cur + 1}镜。当前：${shot.spec["景别"]}·${shot.spec["机位"]}·${shot.spec["运镜"]}——${shot.spec["画面"]}
全片一致性锚（片库检索注入）：
已定稿镜头：${ctx.locked.join("；") || "（暂无）"}
角色卡：${ctx.cast.join("；")}
保留画面主旨与出场角色，换更有表现力的景别/运镜/机位。只输出 JSON。` }
      ], { json: true, temp: 0.9, max: 300 });
      const j = extractJSONLoose(out);
      const s0 = j && (Array.isArray(j.shots) ? j.shots[0] : j);
      if (!s0 || typeof s0 !== "object") throw new Error("格式不合格");
      const next = SB.normSpec({
        "景别": s0["景别"], "机位": s0["机位"], "运镜": s0["运镜"], "画面": s0["画面"] || shot.spec["画面"],
        "出场角色": s0["出场角色"] && s0["出场角色"].length ? s0["出场角色"] : shot.spec["出场角色"],
        "天气": s0["天气"] || shot.spec["天气"], "时段": s0["时段"] || shot.spec["时段"] });
      next["出场角色"] = next["出场角色"].filter(n => castArr().some(c => c.name === n));
      shot.spec = next;
      log("咔", `改成：${next["景别"]}·${next["机位"]}·${next["运镜"]}——${next["画面"].slice(0, 22)}…`);
    } catch (e) {
      log("咔", `改机位失败（${String(e.message || e).slice(0, 36)}）——按原参数出新变体。`);
    }
    w.flags.draw = { mode: "ai" };
  }
  function doLock() {
    const shot = S.shots[S.cur];
    if (!shot || shot.status === "locked") return;   /* 连点/重入防重：一镜只入账一次 */
    const v = shot.variants[shot.variants.length - 1];
    if (!v) { log("咔", "还没抽卡——先抽一张再定稿。"); return; }
    shot.status = "locked"; shot.locked = v;
    S.reel.push(S.cur);
    mem.record("filmset", { turn: S.turn, about: "locked", imp: 10,
      text: `第${S.cur + 1}镜定稿·${shot.spec["景别"]}·${shot.spec["运镜"]}·${shot.spec["画面"].slice(0, 24)}·seed ${SB.hex8(v.seed)}${v.ref != null ? "·ref " + SB.hex8(v.ref) : ""}·${shot.spec["出场角色"].join("/") || "空镜"}` });
    log("咔", `第${S.cur + 1}镜——咔！定稿（v${v.ver}，seed ${SB.hex8(v.seed)}）。`);
    log("回放", `已归档 ${S.reel.length}/${S.shots.length} 镜（about=locked，imp=10）。`);
    S.verified = false; S.premiered = false;
    const nxt = S.shots.findIndex(s => s.status === "pending");
    if (nxt >= 0) {
      S.cur = nxt; S.ctx = buildCtx(nxt);
      log("咔", `下一镜：第${nxt + 1}镜（${S.shots[nxt].spec["景别"]}）——参考帧下拉框已更新，胶片剩 ${S.film} 卷。`);
    } else {
      S.ctx = null;
      log("甲方", "全部定稿。成片板摆开：先重放对账，再首映。");
    }
    playClipAll("ThumbsUp");
  }

  /* ================= ③ 重放对账 / 首映 / 片库 ================= */
  function verifyReel() {
    if (!S.reel.length) return;
    const rows = []; let layoutOkAll = true, pixelOkAll = true;
    for (const i of S.reel) {
      const sh = S.shots[i];
      const c = frameCreds(sh, sh.locked, i);
      const lok = c.layout === sh.locked.ld;   /* 参数级凭证：布局逐字段一致 */
      const pok = c.pixel === sh.locked.hash;  /* 像素级复核：同会话重绘逐像素一致 */
      if (!lok) layoutOkAll = false;
      if (!pok) pixelOkAll = false;
      rows.push({ i, h: c.pixel, ok: pok, lok });
    }
    S.verified = layoutOkAll && S.reel.length === S.shots.length && S.shots.length > 0;
    const drift = rows.filter(r => r.lok && !r.ok).length;
    log("回放", S.verified
      ? (pixelOkAll
        ? `全片 ${S.reel.length} 镜同 seed 重绘：布局摘要逐镜吻合，像素复核逐镜一致——回放不撒谎。`
        : `全片 ${S.reel.length} 镜布局摘要逐镜吻合（参数级可复现）；${drift} 镜像素层检出环境光栅噪声，参数与构图仍逐字段一致。`)
      : "有镜头布局摘要对不上！拍摄参数出现漂移，请检查。");
    saveState(); renderAll(rows);
  }
  async function playPremiere() {
    if (!S.reel.length || S.reel.length !== S.shots.length) return;
    const board = document.getElementById("board");
    board.classList.remove("hidden");
    const cv = document.getElementById("card");
    document.getElementById("board-idx").textContent = "重放";
    for (const i of S.reel) {
      const sh = S.shots[i];
      document.querySelector("#board .board-head b").childNodes[0].textContent = `🎬 成片重放 · 第 ${i + 1} 镜 `;
      renderCard(cv, sh, sh.locked, i);
      await new Promise(z => setTimeout(z, 750));
    }
    S.premiered = true;
    log("甲方", `能复现，我就签——「${S.project.title}」全片 ${S.shots.length} 镜一致性通过，账面：胶片剩 ${S.film} 卷、复用 ${S.reusedTotal} 次。定稿即资产。`);
    playClipAll("Dance");
    saveState(); renderAll();
  }
  function exportFilmLib() {
    const blob = new Blob([mem.export()], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `oriera-片库-${GAME.id}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    S.archived = true; saveState();
    log("系统", `片库档案导出（${mem.lenTotal()} 条记忆）——角色卡/剧本/定稿镜头全在里头。`);
    renderAll();
  }
  function exportSave() {
    const data = {};
    for (let k = 0; k < localStorage.length; k++) {
      const key = localStorage.key(k);
      if (key && key.startsWith(KEY)) data[key] = localStorage.getItem(key);
    }
    const blob = new Blob([JSON.stringify({ game: GAME.id, saved_at: Date.now(), data }, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `oriera-存档-${GAME.id}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  }
  function importSave(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result);
        Object.entries(j.data || {}).forEach(([k, v]) => localStorage.setItem(k, v));
        location.reload();
      } catch (e) { log("系统", "存档文件无法识别"); renderAll(); }
    };
    r.readAsText(file);
  }

  /* ================= 渲染 ================= */
  const $ = id => document.getElementById(id);
  function renderHud() {
    $("hud-title").textContent = S.project ? `「${S.project.title}」` : GAME.name;
    $("hud-style").textContent = S.project ? S.project.style : GAME.tagline.slice(0, 18) + "…";
    $("hud-film").textContent = S.film;
    $("hud-shot").textContent = `${S.reel.length}/${S.shots.length || (S.project ? S.shots.length : 0)}`;
    $("hud-turn").textContent = S.turn;
  }
  function renderBoard() {
    const board = $("board"), boot = $("boot-card");
    if (!S.project) { board.classList.add("hidden"); boot.classList.remove("hidden"); return; }
    boot.classList.add("hidden");
    const shot = S.shots[S.cur];
    if (!shot || shot.status !== "pending") { board.classList.add("hidden"); return; }
    board.classList.remove("hidden");
    $("board-idx").textContent = S.cur + 1;
    $("board-spec").textContent = `${shot.spec["景别"]}·${shot.spec["机位"]}·${shot.spec["运镜"]}·${shot.spec["天气"]}/${shot.spec["时段"]} · 出场：${shot.spec["出场角色"].join("、") || "空镜"}`;
    const v = shot.variants[shot.variants.length - 1];
    if (v) {
      renderCard($("card"), shot, v, S.cur);   /* 换镜/定稿后重绘当前卡（同 seed 同像素） */
      $("board-take").textContent = `v${v.ver}`;
      $("board-seed").textContent = SB.hex8(v.seed);
      $("board-ref").textContent = v.ref == null ? "—" : SB.hex8(v.ref);
      $("board-hash").textContent = v.hash;
    } else {
      $("board-take").textContent = "0"; $("board-seed").textContent = "—";
      $("board-ref").textContent = "—"; $("board-hash").textContent = "—";
    }
    $("btn-draw").disabled = S.film < 1 || !!v;
    $("btn-draw").textContent = v ? "🎲 已抽本镜首卡" : "🎲 抽卡（−1 卷）";
    $("btn-redraw").disabled = S.film < 1;
    const sel = $("ref-sel");
    sel.innerHTML = S.reel.length
      ? S.reel.map(i => `<option value="${i}">第${i + 1}镜·${S.shots[i].spec["景别"]}</option>`).join("")
      : `<option value="">（尚无定稿）</option>`;
    $("btn-reuse").disabled = !S.reel.length;
    $("btn-ai").classList.toggle("hidden", !providerReady);
    $("btn-lock").disabled = !v;
    const ctxChips = S.ctx || { cast: [], locked: [] };
    $("ctx-chips").innerHTML =
      `导演上下文（片库检索注入）：` +
      ctxChips.cast.map(t => `<span class="tk">🎭 ${esc(t.slice(0, 26))}</span>`).join("") +
      ctxChips.locked.map(t => `<span class="tk">🔒 ${esc(t.slice(0, 26))}</span>`).join("") +
      (ctxChips.cast.length + ctxChips.locked.length ? "" : "（片库暂无相关记忆）");
  }
  function renderSetPage() {
    if (!S.project) {
      $("set-intro").innerHTML = `<h4 class="sec">怎么玩</h4>` +
        GAME.core_loop.map(s => `<div class="mech"><div>${esc(s)}</div></div>`).join("") +
        `<h4 class="sec">机制</h4>` +
        GAME.mechanics.map(m => `<div class="mech"><b>${esc(m.name)}</b><div>${esc(m.detail)}</div></div>`).join("");
      $("set-body").innerHTML = "";
    } else {
      $("set-intro").innerHTML = "";
      const shot = S.shots[S.cur];
      const head = shot && shot.status === "pending"
        ? `<div class="mech"><b>正在拍：第 ${S.cur + 1} 镜</b><div>${esc(shot.spec["景别"])}·${esc(shot.spec["机位"])}·${esc(shot.spec["运镜"])}——${esc(shot.spec["画面"])}</div>
           <div>出场：${esc(shot.spec["出场角色"].join("、") || "空镜")} · ${esc(shot.spec["天气"])}·${esc(shot.spec["时段"])} · take ${shot.variants.length}</div></div>`
        : `<div class="mech"><b>拍摄完成</b><div>全部 ${S.shots.length} 镜已定稿——去「片库」页重放对账与首映。</div></div>`;
      $("set-body").innerHTML = head + `<h4 class="sec">镜头单</h4>` +
        S.shots.map((s, i) => `<div class="shot-row ${i === S.cur ? "cur" : ""} ${s.status === "locked" ? "locked" : ""}" data-i="${i}">
          <span class="st">${s.status === "locked" ? "✅" : i === S.cur ? "🎬" : "▫️"}</span>
          <span>第${i + 1}镜 ${esc(s.spec["景别"])}</span><span class="one">${esc(s.spec["画面"].slice(0, 16))}…</span>
          <span class="one">${s.status === "locked" ? "seed " + SB.hex8(s.locked.seed) : s.variants.length + " take"}</span></div>`).join("");
      $("set-body").querySelectorAll(".shot-row").forEach(r => r.onclick = () => {
        const i = +r.dataset.i;
        if (S.shots[i].status === "pending") { S.cur = i; S.ctx = buildCtx(i); renderAll(); saveState(); }
      });
    }
    $("log-view").innerHTML = `<h4 class="sec">片场通告（对讲机）</h4>` +
      S.log.slice(-40).reverse().map(l =>
        l.who === "系统" ? `<div class="logline sys">· ${esc(l.text)}</div>`
          : `<div class="logline"><b>${esc(l.who)}</b>：${esc(l.text)}</div>`).join("");
  }
  function beatProgress() {
    const all = S.reel.length === S.shots.length && S.shots.length > 0;
    const st = [];
    st[0] = !!S.project; st[1] = !!S.project; st[2] = !!S.project;
    st[3] = all; st[4] = all;
    st[5] = S.verified; st[6] = S.premiered; st[7] = S.archived;
    return st;
  }
  function renderStoryPage() {
    const el = $("page-story");
    const st = beatProgress();
    let html = `<p class="hint" style="margin-bottom:10px">${esc(STORY.premise)}</p>`;
    STORY.beats.forEach((b, i) => {
      const now = !st[i] && (i === 0 || st[i - 1]);
      html += `<div class="beat ${st[i] ? "done" : now ? "now" : ""}"><div class="ph">${esc(b.phase)}${st[i] ? " · 已完成" : now ? " · 进行中" : ""}</div><div class="tt">${esc(b.title)}</div><div class="ds">${esc(b.desc)}</div></div>`;
    });
    if (S.project) {
      html += `<h4 class="sec">剧本档案</h4><div class="mech"><b>「${esc(S.project.title)}」</b><div>影调：${esc(S.project.style)}</div>
        <div>拍片令：${esc(S.order)}</div><div>镜头 ${S.shots.length} 个 · 卡司 ${S.project.characters.map(c => esc(c.name)).join("/")}</div></div>`;
    }
    el.innerHTML = html;
  }
  function renderCastPage() {
    const el = $("page-cast");
    let html = "";
    if (S.project) {
      html += `<h4 class="sec">角色卡（识别色 = 全片一致性锚）</h4>` +
        S.project.characters.map(c => `<div class="cast-card">
          <div class="cast-ava" style="background:${c.color}22;border-color:${c.color}"></div>
          <div><div class="cast-nm">${esc(c.name)}<span class="cast-tag">${esc(c.tag)}</span></div>
          <div class="cast-ds">${esc(c.desc)}</div>
          <div class="cast-ds mono">识别色 ${c.color} · about=cast · imp=9</div></div></div>`).join("");
    } else html += `<p class="hint">开机后角色卡在此定妆。</p>`;
    html += `<h4 class="sec">片场 crew</h4>` + AGENTS.map((a, i) => `<div class="cast-card">
      <div class="cast-ava" style="background:${CREW_COLOR[i % 4]}22;border-color:${CREW_COLOR[i % 4]}"></div>
      <div><div class="cast-nm">${esc(a.name)}<span class="cast-tag">${esc(a.role)}</span></div>
      <div class="cast-ds">${esc(a.persona.split("【")[0])}</div></div></div>`).join("");
    el.innerHTML = html;
  }
  function renderVault(verifyRows) {
    const el = $("page-vault");
    const stats = providerReady ? provider.stats : { calls: 0, tokens: 0, errors: 0 };
    let html = `<h4 class="sec">预算报表（结账）</h4><table class="eco">
      <tr><th>科目</th><th>数值</th></tr>
      <tr><td>胶片余额</td><td>${S.film} / ${FILM0} 卷（已耗 ${S.spent} 卷）</td></tr>
      <tr><td>抽卡次数 / 变体数</td><td>${S.takes} take（重抽计入）</td></tr>
      <tr><td>参考帧复用（省钱）</td><td>${S.reusedTotal} 次 × 1 卷 = 省 ${S.reusedTotal} 卷</td></tr>
      <tr><td>真实 LLM 调用</td><td>${stats.calls} 次 · ${stats.tokens || 0} tokens · 失败 ${stats.errors || 0}${providerReady ? "" : "（离线规则引擎，0 消耗）"}</td></tr>
      <tr><td>片库记忆</td><td>${mem.lenTotal()} 条（角色卡/剧本/定稿镜头）</td></tr></table>`;
    html += `<h4 class="sec">重放对账（同 seed → 同布局 → 同像素）</h4>
      <button class="vbtn gold" id="btn-verify" ${S.reel.length ? "" : "disabled"}>🔁 逐镜重绘·双凭证对账</button>
      <button class="vbtn" id="btn-premiere" ${S.reel.length === S.shots.length && S.shots.length ? "" : "disabled"}>📽 成片重放·首映验收</button>`;
    const rows = verifyRows || [];
    if (rows.length) {
      html += rows.map(r => `<div class="vrow"><span>第${r.i + 1}镜</span>
        <span class="mono">${r.h}</span>${
          r.ok && r.lok ? `<span class="ok">✓ 布局+像素一致</span>`
          : r.lok ? `<span class="ok">✓ 布局一致</span><span style="color:#d8b24e">△ 像素环境噪点</span>`
          : `<span class="no">✗ 布局不符</span>`}</div>`).join("");
      html += S.verified ? `<div class="mech"><div>✅ 全片重放验证通过——布局摘要逐镜吻合${rows.every(r => r.ok) ? "，像素复核逐镜一致" : "（像素层有环境噪点，参数级可复现已证）"}——「重跑可复现」当场成立。</div></div>`
        : `<div class="mech"><div>❌ 存在布局摘要不符的镜头——拍摄参数与定稿单出现漂移。</div></div>`;
    } else if (S.verified) html += `<div class="mech"><div>✅ 上次对账通过（${S.reel.length} 镜，双凭证齐验）。</div></div>`;
    html += `<h4 class="sec">版本对比（v1 / 最新）</h4><div id="cmp-view">${
      S.shots.some(s => s.variants.length >= 2) ? "" : `<p class="hint">还没有镜头重抽过 2 次以上——去片场板「重抽·换种子」制造 v1/v2。</p>`
    }</div>`;
    html += `<h4 class="sec">片库资产</h4>
      <button class="vbtn gold" id="btn-exlib">📦 导出片库档案</button>
      <button class="vbtn ghost" id="btn-export">📤 导出存档</button>
      <button class="vbtn ghost" id="btn-import">📥 导入存档</button>
      <input type="file" id="save-file" accept="application/json" style="display:none" />
      <br><button class="vbtn ghost" id="btn-reset">🧹 拆台重拍新片（清空本项目状态）</button>`;
    el.innerHTML = html;
    el.querySelector("#btn-verify").onclick = verifyReel;
    el.querySelector("#btn-premiere").onclick = playPremiere;
    el.querySelector("#btn-exlib").onclick = exportFilmLib;
    el.querySelector("#btn-export").onclick = exportSave;
    el.querySelector("#btn-import").onclick = () => el.querySelector("#save-file").click();
    el.querySelector("#save-file").onchange = e => { if (e.target.files[0]) importSave(e.target.files[0]); };
    el.querySelector("#btn-reset").onclick = () => {
      if (!confirm("拆台重拍：清空本片状态（片库记忆保留）。确定？")) return;
      S = freshState(); saveState(); location.reload();
    };
    /* v1/v2 对比（懒渲染） */
    const cmp = el.querySelector("#cmp-view");
    S.shots.forEach((s, i) => {
      if (s.variants.length < 2) return;
      const wrap = document.createElement("div");
      wrap.className = "cmp";
      const figs = [s.variants[0], s.variants[s.variants.length - 1]];
      figs.forEach(v => {
        const cv = document.createElement("canvas"); cv.width = 240; cv.height = 135;
        renderCard(cv, s, v, i);
        const fig = document.createElement("figure");
        fig.appendChild(cv);
        const cap = document.createElement("figcaption");
        cap.textContent = `v${v.ver} · seed ${SB.hex8(v.seed)}${v.ref != null ? " · ref" : ""}`;
        fig.appendChild(cap);
        wrap.appendChild(fig);
      });
      const label = document.createElement("div");
      label.style.cssText = "font-size:11px;color:#7c86a3;align-self:center;";
      label.textContent = `第${i + 1}镜`;
      wrap.prepend(label);
      cmp.appendChild(wrap);
    });
  }
  function renderAll(verifyRows) {
    renderHud(); renderBoard(); renderSetPage(); renderStoryPage(); renderCastPage(); renderVault(verifyRows);
  }

  /* ---- 交互接线 ---- */
  $("btn-draw").onclick = () => { S.flags.draw = { mode: "fresh" }; pump(); };
  $("btn-redraw").onclick = () => { S.flags.draw = { mode: "fresh" }; pump(); };
  $("btn-reuse").onclick = () => {
    const v = $("ref-sel").value;
    if (v === "" || v == null) return;
    S.flags.draw = { mode: "reuse", ref: +v };
    pump();
  };
  $("btn-ai").onclick = () => { S.flags.recreate = true; pump(); };
  $("btn-lock").onclick = () => { S.flags.lock = true; pump(); };
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll(".tab-page").forEach(p => p.classList.remove("on"));
    $("page-" + b.dataset.t).classList.add("on");
  });

  /* ---- 开场 ---- */
  if (!S.project) {
    log("系统", `欢迎来到「${GAME.name}」——写下一句拍片令，三分钟内开机。`);
    AGENTS.forEach((a, i) => setTimeout(() => { log(a.name, a.first_line); renderSetPage(); }, 400 + i * 900));
  } else {
    if (S.shots[S.cur] && S.shots[S.cur].status === "pending") {
      const v = S.shots[S.cur].variants[S.shots[S.cur].variants.length - 1];
      if (v) renderCard($("card"), S.shots[S.cur], v, S.cur);
      S.ctx = buildCtx(S.cur);
    }
    log("系统", `回到片场：「${S.project.title}」已定稿 ${S.reel.length}/${S.shots.length} 镜，胶片剩 ${S.film} 卷。`);
  }
  renderAll();
}
boot();
</script>
</body>
</html>
