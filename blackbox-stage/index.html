    </div>
  </div>

    <div id="tabs">
      <button class="on" data-t="bench">🎬 导演台</button>

      </div>
      <div class="presets" id="presets"></div>
      <div class="budget-row">

      </div>
      <div id="result"></div>
      <p class="hint">离线=关键词路由×种子模板（回放逐字节一致）；在线=temp:0 语义解析（回放高一致，差异高亮）。F5 刷新，黑匣都在本浏览器。</p>
    </div>
    <div id="page-bb" class="tab-page"></div>
    <div id="page-chars" class="tab-page"></div>
    <div id="page-world" class="tab-page"></div>
    <div id="page-codex" class="tab-page"></div>
  </div>
</div>
<div id="fallback">
  <div>
    <div style="font-size:40px">🎬</div>
    <h2 style="margin:12px 0">请通过静态服务器或 OriEra Studio 打开本项目</h2>

  </div>
</div>

/* 【独立部署】kernel / 离线管线 / vendor 全部随项目自带，相对路径解析 */
const VENDOR_BASE = "./vendor/";
const KERNEL = "./engine/kernel.js";
const PIPELINE = "./app/pipeline.js";

/* ============ L7 provider 装配（与引擎 café demo / 先例同一机制） ============ */
/* vendored kernel 不透传 deepseek thinking 开关：V4 思考档会吃掉 max_tokens 预算，
   出现空正文/半句截断。在应用层拦 fetch 注入 thinking:disabled；vendored kernel 保持
   与引擎仓逐字节一致（check.mjs 零漂移门禁），vendor 怪癖归应用层管。 */
{
  const _fetch = window.fetch.bind(window);
  window.fetch = async (u, o) => {
    if (typeof u === "string" && u.includes("api.deepseek.com") && o && o.body) {
      try {
        const b = JSON.parse(o.body);
        if (b.model && b.thinking === undefined) b.thinking = { type: "disabled" };
        o = { ...o, body: JSON.stringify(b) };
      } catch (e) { /* 非 JSON 体原样放行 */ }
    }
    return _fetch(u, o);
  };
}

      if (idle) mixer.clipAction(idle).play();
    } catch (e) {}
    cast.push({ agent: a, root, label, mixer, gltfAnims: gltf.animations, color: palette[i % palette.length] });
  });
  function roundRect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  /* 点击演员 → 广播其当前锚点（锚定可见化） */
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  renderer.domElement.addEventListener("click", e => {
    const r = renderer.domElement.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hits = ray.intersectObjects(cast.map(n => n.root), true);
    if (!hits.length) return;
    let o = hits[0].object;
    while (o && o.userData.index === undefined) o = o.parent;
    if (!o) return;
    const a = STORY.characters[o.userData.index];
    const cur = (kv[a.name] && kv[a.name]["当前状态"]) || a.initState["当前状态"];
    sys(`🎭 ${a.name}（${a.role}）当前锚点：性格「${a.initState["性格"]}」·标志物「${a.initState["标志物"]}」·口癖「${a.initState["口癖"]}」·当前状态「${cur}」`);
  });
  /* 生成阶段演出：受令角色按生成器换动作，落定回 idle */
  const PHASE_CLIP = { plot: "Walking", shots: "Jump", lines: "Wave" };
  function actPhase(phase, names) {
    const clipName = PHASE_CLIP[phase] || "Wave";
    cast.forEach((n, j) => {
      const on = !names || names.includes(STORY.characters[j].name);
      if (!on || !n.mixer || !n.gltfAnims) return;
      const clip = n.gltfAnims.find(c => c.name === clipName) ||
        n.gltfAnims.find(c => new RegExp(clipName, "i").test(c.name));
      if (!clip) return;
      n.mixer.stopAllAction(); n.mixer.clipAction(clip).reset().play();
    });
    clearTimeout(actPhase._t);
    actPhase._t = setTimeout(() => cast.forEach(n => {
      if (!n.mixer) return;
      const idle = n.gltfAnims.find(c => /idle/i.test(c.name)) || n.gltfAnims[0];
      if (idle) { n.mixer.stopAllAction(); n.mixer.clipAction(idle).reset().play(); }
    }), 1700);
  }
  const clock = new THREE.Clock();
  (function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    cast.forEach((n, j) => {
      n.label.position.y = 3.1 + Math.sin(clock.elapsedTime * 2 + j) * 0.06;
      if (n.mixer) n.mixer.update(dt);
      n.root.rotation.y += 0.002;
    });
    controls.update();
    renderer.render(scene, camera);
  })();
  window.addEventListener("resize", () => {
    camera.aspect = sceneEl.clientWidth / sceneEl.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(sceneEl.clientWidth, sceneEl.clientHeight);
  });
  sceneApi = { actPhase };
}

/* L9 长期记忆：每角色＋「世界观」各一条记忆线；引擎导演子系统用独立命名空间不串账 */
const mem = new mod.MemoryStore("game." + GAME.id + ".mem.v1");
const pulseMem = new mod.MemoryStore("game." + GAME.id + ".pulse.v1");

/* 锚点构建：角色卡 initState ＋ KV 覆盖（硬状态不靠 bigram 猜，先例 trust 表同法） */
function buildAnchors() {
  return STORY.characters.map(c => {
    const o = kv[c.name] || {};

    for (const f of TRACK.anchorFields) a[f] = o[f] || c.initState[f];

const ACTS = ["第一幕", "第二幕", "第三幕"];
const beatsOf = a => STORY.beats.filter(b => (b.phase || "").startsWith(ACTS[a - 1]));

/* ============ 引擎挂点：Scheduler 主管线 ＋ DirectorSystem 世界脉搏 ============ */
/* 导演解析→三生成器→封板五系统注册进引擎 Scheduler；每条令 sch.tick(ctx) 一次 pump 完成
   （kernel.js:270-274，L2 分层：应用只 pump 不感知内部系统） */
const scheduler = new mod.Scheduler();
/* DirectorSystem 挂为「今日片场事件」：按 interval 出世界 beat（kernel.js:243-267），
   provider 失败/离线自动落 RULE_BEATS 规则行（kernel.js:260）——演示黑匣对世界漂移的隔离；
   独立 pulseMem 命名空间＋不进 worldHash，绝不污染角色锚定与回放确定性 */
const directorSys = new mod.DirectorSystem(providerReady ? provider : { ready: false }, pulseMem, { interval: 2 });
const pulseWorld = { turn: 0, npcs: [], dialogue: [], guestQueue: [], rel: {}, story: { day: world.act, beats: [] } };
let pulseTokens = 0;
async function pulseTick() {
  pulseWorld.turn++; pulseWorld.story.day = world.act;
  try {
    const before = provider ? (provider.stats.tokens || 0) : 0;
    const b = await directorSys.tick(pulseWorld);
    pulseTokens += provider ? ((provider.stats.tokens || 0) - before) : 0;
    if (b) { pulseLog.unshift({ text: String(b), online: providerReady, at: Date.now() }); pulseLog = pulseLog.slice(0, 8); renderWorld(); }
  } catch (e) { /* 脉搏静默 */ }
}
let pulseLog = [];

/* ============ 运行时工具 ============ */
const $ = id => document.getElementById(id);
const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const extractJSONLoose = s => { const m = (s || "").match(/\{[\s\S]*\}/); try { return m ? JSON.parse(m[0]) : null; } catch { return null; } };
const stableCopy = v => JSON.parse(JSON.stringify(v));
let running = false;
function shakeInput() { const el = $("order-input"); el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function sys(text) { const d = document.createElement("div"); d.className = "sysline"; d.innerHTML = text; $("result").prepend(d); }

/* 每令预算（HUD 与输入框联动；PL 未就绪时退回原值——模块加载是异步的） */
function curBudget() {
  const v = +$("budget").value || TRACK.budgetDefaults.perOrder;

/* ============ 主管线：下令 → 三生成器 → 封板（一次 sch.tick 完成） ============ */
const GEN_LABEL = { plot: "织文·剧情", shots: "格画·分镜", lines: "声线·台词" };
const SEED_SALT = { plot: 0x9e3779b9, shots: 0x85ebca6b, lines: 0xc2b2ae35 };
function genArgs(ctx) {
  const t1 = ctx.anchors.find(a => a.name === ctx.plan.targets[0]);
  const t2 = ctx.anchors.find(a => a.name === ctx.plan.targets[1]) || null;
  return { t1, t2, action: ctx.plan.action, act: ctx.plan.act, beatTitle: beatTitleOf(ctx.plan.act), split: ctx.plan.split };
}
function anchorBlock(ctx) {
  return ctx.plan.targets.map(n => {
    const a = ctx.anchors.find(x => x.name === n);
    const rec = ctx.recall[n] || [];
    return `【角色锚点·${n}】性格：${a["性格"]}；服装：${a["服装"]}；标志物：${a["标志物"]}；口癖：${a["口癖"]}；当前状态：${a["当前状态"]}
L9 召回记忆：
${rec.length ? rec.map(m => `- ${m.text}`).join("\n") : "-（暂无，可能是第一次拍这位）"}`;
  }).join("\n");
}
function recallAnchors(ctx) {
  ctx.recall = {};
  for (const n of ctx.plan.targets)
    ctx.recall[n] = mem.retrieve(n, "设定", ctx.order + ctx.plan.action, ctx.seq, 3);
}
/* 导演台：MemoryStore 检索召回 + offlinePlot/Shots/Lines 模板兜底（app/pipeline.js） */
const GENS = [
  {
    key: "plot", agentIdx: 1,
    sys: ctx => `${AGENTS[1].persona}
世界观前提：${STORY.premise.slice(0, 120)}
${anchorBlock(ctx)}
（现在执行剧情生成：严格按人设中的【剧情卡·输出协议】只输出 JSON，不输出任何其他文字。）`,
    user: ctx => `拍摄计划：${JSON.stringify({ act: ctx.plan.act, characters: ctx.plan.targets, stateDeltas: ctx.plan.stateDeltas, note: ctx.plan.note })}
本幕节拍：${beatsTitleOf(ctx.plan.act)}
（输出 {"text":"120~200字剧情段落"} 剧情卡）`,
    parse: out => { const j = extractJSONLoose(out); const t = j && String(j.text || "").trim(); return t ? { beat: t.slice(0, 400) } : null; },
    fallback: ctx => ({ beat: PL.offlinePlot(genArgs(ctx), PL.mulberry32((ctx.seed ^ SEED_SALT.plot) >>> 0)) }),
  },
  {
    key: "shots", agentIdx: 2,
    sys: ctx => `${AGENTS[2].persona}
世界观前提：${STORY.premise.slice(0, 120)}
${anchorBlock(ctx)}
（现在执行分镜生成：严格按人设中的【分镜表·输出协议】只输出 JSON，不输出任何其他文字。）`,
    user: ctx => `拍摄计划：${JSON.stringify({ act: ctx.plan.act, characters: ctx.plan.targets, stateDeltas: ctx.plan.stateDeltas })}
剧情卡（承接此段节奏）：${(ctx.parts.beat || "").slice(0, 160)}
本幕节拍：${beatsTitleOf(ctx.plan.act)}
（输出 {"shots":[{"id":1,"size":"…","move":"…","visual":"…"}]} 分镜表）`,
    parse: out => {
      const j = extractJSONLoose(out); const arr = j && Array.isArray(j.shots) ? j.shots : null;
      if (!arr || !arr.length) return null;
      return { shots: arr.slice(0, 6).map((s, i) => ({
        id: i + 1, size: String(s && s.size || "中景").slice(0, 6),
        move: String(s && s.move || "固定").slice(0, 6),
        visual: String(s && s.visual || "").slice(0, 60) || "（画面待补）" })) };
    },
    fallback: ctx => ({ shots: PL.offlineShots(genArgs(ctx), PL.mulberry32((ctx.seed ^ SEED_SALT.shots) >>> 0)) }),
  },
  {
    key: "lines", agentIdx: 3,
    sys: ctx => `${AGENTS[3].persona}
世界观前提：${STORY.premise.slice(0, 120)}
${anchorBlock(ctx)}
（现在执行台词生成：严格按人设中的【台词表·输出协议】只输出 JSON，不输出任何其他文字。）`,
    user: ctx => `拍摄计划：${JSON.stringify({ act: ctx.plan.act, characters: ctx.plan.targets, stateDeltas: ctx.plan.stateDeltas })}
剧情卡：${(ctx.parts.beat || "").slice(0, 120)}
分镜表：${JSON.stringify(ctx.parts.shots || []).slice(0, 240)}
（输出 {"lines":[{"speaker":"…","text":"…"}]} 台词表）`,
    parse: out => {
      const j = extractJSONLoose(out); const arr = j && Array.isArray(j.lines) ? j.lines : null;
      if (!arr || !arr.length) return null;
      return { lines: arr.slice(0, 5).map(l => ({
        speaker: String(l && l.speaker || "旁白").slice(0, 8),
        text: String(l && l.text || "").slice(0, 60) })) };
    },
    fallback: ctx => ({ lines: PL.offlineLines(genArgs(ctx), PL.mulberry32((ctx.seed ^ SEED_SALT.lines) >>> 0)) }),
  },
];
/* 五系统：解析 → 织文 → 格画 → 声线 → 封板（顺序即 Scheduler 注册序） */
scheduler.add({
  async tick(ctx) {
    let plan = null;
    if (ctx.mode === "online" && providerReady) {
      try {
        const out = await provider.complete([
          { role: "system", content: `${AGENTS[0].persona}
世界观圣经：${STORY.premise}
角色名单：${ctx.anchors.map(a => `${a.name}（${a.role}·当前状态「${a["当前状态"]}」）`).join("；")}
每令预算：${ctx.budget} token，单生成器下限 ${ctx.floor}。当前幕：第${ctx.act}幕。
（现在执行导演令解析：严格按人设中的【拍摄计划·输出协议】只输出 JSON，不输出任何其他文字。）` },
          { role: "user", content: `导演令：「${ctx.order}」` },
        ], { temp: TRACK.replayPolicy.temp, json: true, max: Math.min(AGENTS[0].max_tokens, 240) });
        plan = PL.normalizePlan(extractJSONLoose(out), ctx.anchors, ctx.act, ctx.budget, ctx.floor);
        if (!plan.ok) ctx.degraded = `导演解析降级（${plan.reason}）→离线关键词路由`;
      } catch (e) { plan = null; ctx.degraded = "导演解析降级（" + String(e.message || e) + "）→离线关键词路由"; }
    }
    if (!plan || !plan.ok) {
      plan = PL.parseOrderOffline(ctx.order, ctx.anchors, ctx.act, ctx.budget, ctx.floor, ctx.wHash);
      if (!plan.ok) { ctx.parseFail = plan.reason; return; }
    }
    ctx.plan = plan;
    recallAnchors(ctx);
  },
});
for (const g of GENS) scheduler.add({
  async tick(ctx) {
    if (ctx.parseFail) return;
    const alloc = ctx.plan.split[g.key];
    const agent = AGENTS[g.agentIdx];
    const max = Math.min(alloc, agent.max_tokens);
    const row = { gen: g.key, label: GEN_LABEL[g.key], allocated: alloc, sent: max, used: 0, degraded: false };
    if (ctx.mode === "online" && providerReady) {
      const before = provider.stats.tokens || 0;
      try {
        sceneApi && sceneApi.actPhase(g.key, ctx.plan.targets);
        const out = await provider.complete([
          { role: "system", content: g.sys(ctx) },
          { role: "user", content: g.user(ctx) },
        ], { temp: TRACK.replayPolicy.temp, json: true, max });
        const part = g.parse(out);
        if (!part) throw new Error("输出 JSON 不合协议");
        Object.assign(ctx.parts, part);
        row.used = (provider.stats.tokens || 0) - before;
      } catch (e) {
        row.degraded = true; row.used = alloc;
        Object.assign(ctx.parts, g.fallback(ctx));
        ctx.degraded = (ctx.degraded ? ctx.degraded + "；" : "") + `${GEN_LABEL[g.key]}降级（${String(e.message || e).slice(0, 40)}）→种子模板`;
      }
    } else {
      row.used = alloc; /* 离线：按分拨记「模拟 token」 */
      Object.assign(ctx.parts, g.fallback(ctx));
    }
    ctx.ledger.push(row);
  },
});
scheduler.add({
  async tick(ctx) {
    if (ctx.parseFail) return;
    ctx.script = {
      beat: ctx.parts.beat || "", shots: ctx.parts.shots || [],
      lines: ctx.parts.lines || [], stateDeltas: ctx.plan.stateDeltas,
    };
  },
});

/* ============ 下令 / 重放（同一管线；重放吃冻结快照，非破坏） ============ */
const orderInput = $("order");
async function runOrder(orderText, replayOf) {
  if (running) return;
  const order = (orderText || "").trim();
  if (!order) { shakeInput(); return; }
  if (!PL) { sys("（管线模块未加载）"); return; }
  running = true;
  $("send").disabled = true;
  const isReplay = !!replayOf;
  const budget = isReplay ? replayOf.budget : curBudget();
  /* mode 取当前 provider 实况：在线原片回放时若已断网/失 Key，降级离线种子重跑——
     diff 如实亮出「在线原片 vs 离线重放」的差异，不假装一致 */
  let mode = providerReady ? "online" : "offline";
  const ctx = {
    order, budget, floor: FLOOR,
    anchors: isReplay ? replayOf.anchorsSnapshot : buildAnchors(),
    kv: isReplay ? stableCopy(replayOf.kvSnapshot) : kv,
    act: isReplay ? replayOf.act : world.act,
    mode,
    parts: {}, ledger: [], recall: {},
    degraded: isReplay && replayOf.mode === "online" && mode === "offline"
      ? "在线原片回放时无可用 provider →降级离线种子重跑（下方 diff 为在线原片 vs 离线重放）" : null,
    seq: world.seq,
  };
  /* 世界哈希：act + KV 状态 + 预算 → 与离线种子互锁（mulberry32(cmdHash^worldHash)） */
  ctx.wHash = PL.worldHash({ act: ctx.act, kv: stableCopy(ctx.kv), budget: ctx.budget });
  ctx.seed = (PL.fnv1a(order.replace(/\s+/g, "")) ^ ctx.wHash) >>> 0;

  let cp;
  if (isReplay) cp = replayOf;
  else {
    world.seq++; saveWorld();
    cp = {
      id: "bb" + world.seq, order, act: ctx.act, budget, floor: FLOOR,
      anchorsSnapshot: buildAnchors(), kvSnapshot: stableCopy(kv),
      status: "draft", createdAt: Date.now(), replays: 0,
      mode: ctx.mode, providerId: providerReady ? provider.id : "rule",
      plan: null, script: null, ledger: null, replay: null,
    };
    blackbox.unshift(cp); saveBlackbox(); renderHUD();
  }
  sys(isReplay
    ? `🔁 重放 ${cp.id}：已恢复黑匣快照（第${cp.act}幕·冻结锚点）——非破坏重跑中……`
    : `🎬 下令：${esc(order)}——解析中……`);
  try { await scheduler.tick(ctx); } catch (e) { ctx.parseFail = ctx.parseFail || String(e.message || e); }

  if (ctx.parseFail) {
    if (!isReplay) { blackbox = blackbox.filter(c => c.id !== cp.id); saveBlackbox(); renderHUD(); }
    sys("⚠️ " + esc(ctx.parseFail));
    shakeInput(); running = false; $("send").disabled = false; return;
  }
  cp.plan = ctx.plan; cp.script = ctx.script; cp.ledger = ctx.ledger;
  if (isReplay) {
    cp.replay = { script: ctx.script, diff: PL.diffScript(cp.script, ctx.script), ledger: ctx.ledger, mode: ctx.mode, degraded: ctx.degraded, at: Date.now() };
    cp.replays++;
    saveBlackbox();
    renderBlackbox(); switchTab("bb"); renderBBDiff(cp.id);
    const allGreen = cp.replay.diff.identical;
    sys(allGreen
      ? `✅ ${cp.id} 回放完成：逐字段<b style="color:#7ee2a8">全部一致</b>${cp.mode === "offline" ? "（离线种子回放＝逐字节一致）" : "（在线 temp=0 命中一致）"}`
      : `🔁 ${cp.id} 回放完成：${cp.mode === "online" ? "在线 temp=0 高一致，差异已高亮（可验证的复现）" : "与存档有差异，已逐字段亮出"}`);
  } else {
    saveBlackbox();
    lastCtx = ctx; lastCpId = cp.id;
    renderResult(cp, ctx);
    renderHUD(); renderBlackbox(); renderChars();
    sys(`📦 已落黑匣 ${cp.id}（草稿·${ctx.mode === "online" ? "在线 temp=0" : "离线种子"}）——重放验证或定稿写回`);
    pulseTick(); /* 世界脉搏：与正片账、回放确定性均无关（对照源） */
  }
  running = false; $("send").disabled = false;
}
let lastCtx = null, lastCpId = null;
$("send").onclick = () => runOrder(orderInput.value, null);
orderInput.addEventListener("keydown", e => { if (e.key === "Enter" && !running) runOrder(orderInput.value, null); });
/* 预置导演令（设计示例在列） */
[["让林见鹿在第 3 幕黑化"], ["让沈听澜在第 2 幕重逢"], ["让苏鸢在第 1 幕觉醒"]]
  .forEach(([t]) => {
    const b = document.createElement("button");
    b.textContent = t;
    b.onclick = () => { orderInput.value = t; if (!running) runOrder(t, null); };
    $("presets").appendChild(b);
  });

/* ============ 定稿：状态变更写回记忆线并锁匣 ============ */
function finalizeCp(id) {
  const cp = blackbox.find(c => c.id === id);
  if (!cp || cp.status !== "draft") return;
  for (const d of cp.script.stateDeltas || []) {
    kv[d.character] = Object.assign({}, kv[d.character], { [d.key]: d.value });
    mem.record(d.character, { turn: world.seq, day: cp.act, about: "世界",
      text: `${d.key}→${d.value}（第${cp.act}幕·令「${cp.order.slice(0, 16)}」定稿）`, imp: 5 });
  }
  for (const l of cp.script.lines || [])
    if (STORY.characters.some(c => c.name === l.speaker))
      mem.record(l.speaker, { turn: world.seq, day: cp.act, about: "台词",
        text: `台词（第${cp.act}幕定稿）${l.text}`, imp: 3 });
  world.act = cp.plan.act; saveKV(); saveWorld();
  cp.status = "final"; saveBlackbox();
  renderHUD(); renderChars(); renderBlackbox(); renderWorld();
  sceneApi && sceneApi.actPhase("lines", cp.plan.targets);
  sys(`🔒 ${cp.id} 定稿：状态变更已写回角色记忆线，剧本推进到第 ${cp.plan.act} 幕，黑匣落锁。`);
}
function discardCp(id) {
  const cp = blackbox.find(c => c.id === id);
  if (!cp || cp.status !== "draft") return;
  blackbox = blackbox.filter(c => c.id !== id); saveBlackbox();
  renderHUD(); renderBlackbox();
  sys(`🗑 ${cp.id} 草稿已弃——世界未被触动。`);
}

/* ============ 渲染：导演台结果（拍摄计划 + 账本 + 三栏分镜） ============ */

  const sb = w => Math.round(w / Math.max(splitSum, 1) * 100);
  const recallHTML = Object.entries(ctx.recall || {}).map(([n, rec]) =>
    `<div><b>${esc(n)}</b>：${rec.length ? esc(rec[0].text.slice(0, 26)) : "（无召回）"}</div>`).join("");

  ${deg}
  <div class="card">
    <h4>📋 拍摄计划 · ${esc(p.source === "ai-director" ? "AI 导演「开镜」" : "离线路由")} · <span class="bb-id">${cp.id} ${cp.status === "final" ? "🔒已定稿" : "草稿"}</span></h4>
    <div class="plan-line">第 <b>${p.act}</b> 幕「${esc(beatTitleOf(p.act))}」 · 波及角色 <b>${p.targets.map(esc).join("、")}</b> · 动作 <b>${esc(p.action)}</b></div>
    <div class="plan-line">状态变更草案：${p.stateDeltas.length ? p.stateDeltas.map(d => `<b>${esc(d.character)}.${esc(d.key)}→${esc(d.value)}</b>`).join("；") : "（无——纯定场戏）"}</div>
    <div class="plan-line" style="color:#8a93ad">${esc(p.note)}</div>
    <div class="splitbar">
      <div style="width:${sb(p.split.plot)}%;background:#7eb8ff" title="剧情 ${p.split.plot}">剧情${p.split.plot}</div>
      <div style="width:${sb(p.split.shots)}%;background:#9f8fff" title="分镜 ${p.split.shots}">分镜${p.split.shots}</div>
      <div style="width:${sb(p.split.lines)}%;background:#7effc3" title="台词 ${p.split.lines}">台词${p.split.lines}</div>
    </div>
    <div class="recall">🔍 召回锚点（MemoryStore·L9）：${recallHTML}</div>
  </div>
  <div class="card">
    <h4>🧾 预算账本（${ctx.mode === "online" ? "provider.stats.tokens 差值实账" : "离线模拟 token·按分拨记账"}）</h4>
    <table class="ledger"><tr><th>生成器</th><th class="num">分拨</th><th class="num">实发 max</th><th class="num">实耗</th><th></th></tr>
    ${ctx.ledger.map(r => `<tr><td>${esc(r.label)}</td><td class="num">${r.allocated}</td><td class="num">${r.sent}</td><td class="num">${r.used}</td><td>${r.degraded ? "⚠️降级" : (ctx.mode === "online" ? "✓" : "模拟")}</td></tr>`).join("")}
    </table>
    <div class="ledger-foot">合计 实耗 ${usedSum} / 预算 ${cp.budget} · 回放调用单独计费不入本账 · 引擎世界脉搏旁支账 ${pulseTokens} token</div>
  </div>
  <div class="script3">
    <div class="col"><h4>📜 剧情 · 织文</h4><div class="plottext">${esc(cp.script.beat)}</div></div>
    <div class="col"><h4>🎬 分镜 · 格画（${(cp.script.shots || []).length} 格）</h4>
      ${(cp.script.shots || []).map(s => `<div class="shot"><b>第${s.id}格 · ${esc(s.size)} · ${esc(s.move)}</b><br>${esc(s.visual)}</div>`).join("")}</div>
    <div class="col"><h4>🎙 台词 · 声线（${(cp.script.lines || []).length} 条）</h4>
      ${(cp.script.lines || []).map(l => `<div class="line-row"><b>${esc(l.speaker)}</b>：${esc(l.text)}</div>`).join("")}</div>
  </div>
  <div class="actions">
    <button id="btn-replay">🔁 重放此令</button>
    <button id="btn-final" ${cp.status === "final" ? "disabled" : ""}>✅ 定稿写回</button>
    <button id="btn-discard" ${cp.status === "final" ? "disabled" : ""}>🗑 丢弃</button>
  </div>`;
  $("btn-replay").onclick = () => runOrder(cp.order, cp);
  $("btn-final").onclick = () => finalizeCp(cp.id);
  $("btn-discard").onclick = () => discardCp(cp.id);
}

/* ============ 渲染：黑匣（checkpoint 列表 + diff 视图） ============ */
function renderBlackbox() {
  const el = $("page-bb");
  if (!blackbox.length) { el.innerHTML = `<p class="hint">黑匣空——回「导演台」发第一条令。每条令的命令全文＋世界状态快照都会落一条 checkpoint。</p>`; return; }
  el.innerHTML = `<p class="hint" style="margin-bottom:8px">黑匣 checkpoint＝命令全文＋世界快照（LangGraph checkpoint 的最小等价物）。「重放此令」恢复冻结锚点非破坏重跑；「定稿」才把状态变更写回世界。</p>` +
    blackbox.map(cp => {
      const badges = [`<span class="badge ${cp.status === "final" ? "final" : "draft"}">${cp.status === "final" ? "🔒已定稿" : "草稿"}</span>`];
      if (cp.replays) badges.push(`<span class="badge replayed">🔁重放×${cp.replays}</span>`);
      return `<div class="bb-item" id="bb-${cp.id}">
      <div class="bb-head"><span class="bb-id">${cp.id} · ${new Date(cp.createdAt).toLocaleTimeString()}</span>${badges.join("")}
        <span class="bb-id">${cp.mode === "online" ? "在线 temp=0" : "离线种子"} · ${esc(cp.providerId || "")}</span></div>
      <div class="bb-order">「${esc(cp.order)}」</div>
      <div class="bb-meta">第${cp.act}幕 · ${cp.plan ? esc(cp.plan.action) : ""} · 预算 ${cp.budget} · 状态草案 ${cp.plan ? cp.plan.stateDeltas.length : 0} 条 · 快照锚点 ${cp.anchorsSnapshot.length} 人</div>
      <div class="bb-actions">
        <button data-a="replay" data-id="${cp.id}">🔁 重放此令</button>
        <button data-a="final" data-id="${cp.id}" ${cp.status === "final" ? "disabled" : ""}>✅ 定稿</button>
        <button data-a="discard" data-id="${cp.id}" ${cp.status === "final" ? "disabled" : ""}>🗑 丢弃</button>
        ${cp.replay ? `<button data-a="diff" data-id="${cp.id}">🔍 查看回放 diff</button>` : ""}
      </div>
      <div class="diffslot" id="diff-${cp.id}"></div>
    </div>`;
    }).join("");
  el.querySelectorAll(".bb-actions button").forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    if (b.dataset.a === "replay") runOrder(blackbox.find(c => c.id === id).order, blackbox.find(c => c.id === id));
    else if (b.dataset.a === "final") finalizeCp(id);
    else if (b.dataset.a === "discard") discardCp(id);
    else renderBBDiff(id);
  });
}
function renderBBDiff(id) {
  const cp = blackbox.find(c => c.id === id);
  const slot = document.getElementById("diff-" + id);
  if (!cp || !cp.replay || !slot) return;
  const d = cp.replay.diff;
  const fldZh = { beat: "剧情卡", shots: "分镜表", lines: "台词表", stateDeltas: "状态变更" };
  const rowMark = f => { const r = d.fields.find(x => x.field === f); return r && r.same; };
  const shotMark = d.shots.every(x => x.same) && (cp.script.shots || []).length === (cp.replay.script.shots || []).length;
  const lineMark = d.lines.every(x => x.same) && (cp.script.lines || []).length === (cp.replay.script.lines || []).length;
  slot.innerHTML = `<div class="diffbox">
    <h5 class="${d.identical ? "all-green" : "has-diff"}">${d.identical ? "✅ 回放 diff：逐字段全部一致" : "⚠️ 回放 diff：存在差异（已高亮）"}</h5>
    ${["beat", "shots", "lines", "stateDeltas"].map(f => {
      let extra = "";
      if (f === "shots") extra = `（${d.shots.filter(x => x.same).length}/${d.shots.length} 格一致）`;
      if (f === "lines") extra = `（${d.lines.filter(x => x.same).length}/${d.lines.length} 条一致）`;
      return `<div class="diff-row"><span>${fldZh[f]}${extra}</span><span class="${rowMark(f) ? "same" : "diff"}">${rowMark(f) ? "一致 ✓" : "差异 ⚠"}</span></div>`;
    }).join("")}
    <div class="diff-note">${cp.replay.mode === "offline"
      ? "离线回放：mulberry32(令哈希^世界哈希) 种子重放，同令同存档＝逐字节一致。"
      : "在线回放：temp=0 真实透传（kernel.js:81 传 0 非 nullish 即生效），「可验证的复现」而非魔法一致——厂商批处理/浮点仍可漂移，diff 亮出差异而非假装 100%。"}${cp.replay.degraded ? "<br>⚠️ 本次回放发生降级：" + esc(cp.replay.degraded) : ""}</div>
    ${cp.replay.ledger && cp.replay.ledger.length ? `<table class="ledger"><tr><th>回放计费（不入正片账）</th><th class="num">分拨</th><th class="num">实耗</th></tr>
      ${cp.replay.ledger.map(r => `<tr><td>${esc(r.label)}</td><td class="num">${r.allocated}</td><td class="num">${r.used}</td></tr>`).join("")}</table>` : ""}
  </div>`;
}

/* ============ 渲染：角色（锚点表＋KV 硬状态） / 世界 / 玩法 / HUD ============ */
function renderChars() {
  const anchors = buildAnchors();
  $("page-chars").innerHTML = `<p class="hint" style="margin-bottom:8px">五锚点＝性格/服装/标志物/口癖/当前状态。initState 首访灌入 L9 记忆线；定稿令把「当前状态」变更写回 KV 表与记忆线——每个生成器开跑前都会召回它们。</p>` +
    anchors.map(a => {
      const changed = (kv[a.name] && kv[a.name]["当前状态"]) || "";
      const memN = (mem.mem[a.name] || []).length;
      return `<div class="char-card">
      <div><span class="nm">${esc(a.name)}</span><span class="rl">${esc(a.role)}</span></div>
      <div class="meta">🎨 ${esc(a.appearance)}</div>
      <div class="meta">🎙 ${esc(a.voice)}</div>
      <table class="anchor-table">
        ${TRACK.anchorFields.map(f => `<tr><td>${f}</td><td class="${f === "当前状态" && changed ? "changed" : ""}">${esc(a[f])}${f === "当前状态" && changed ? " ←已由定稿令改写" : ""}</td></tr>`).join("")}
      </table>
      <div class="meta" style="color:#5f6b8a;margin-top:5px">L9 记忆线 ${memN} 条</div>
    </div>`;
    }).join("");
}
function renderWorld() {
  const el = $("page-world");
  el.innerHTML = `
  <div class="card"><h4>📖 世界观圣经 · ${esc(STORY.framework)}</h4><div class="plan-line" style="line-height:1.8">${esc(STORY.premise)}</div></div>
  <h4 class="sect">三幕节拍（${STORY.beats.length} 拍）</h4>
  ${STORY.beats.map((b, i) => `<div class="beat ${i === world.act - 1 ? "now" : ""}"><div class="ph">${esc(b.phase)}</div><div class="tt">${esc(b.title)}</div><div class="ds">${esc(b.desc)}</div><div class="ex">${esc(b.expect || "")}</div></div>`).join("")}
  <h4 class="sect">📡 世界脉搏 · 引擎 DirectorSystem 通道</h4>
  <p class="hint" style="margin:0 0 6px">引擎导演子系统按令出世界事件（离线落引擎内置规则行，kernel.js:260；内容属引擎内置世界，与雁回城剧本无涉）——它只会让世界「在动」，进不了黑匣的 worldHash：正是回放确定性的对照源。旁支计费 ${pulseTokens} token。</p>
  ${(pulseLog.length ? pulseLog : [{ text: "（尚无脉搏——发一条令后引擎导演子系统开始出事件）", online: null }]).map(p =>
    `<div class="pulse-row">${p.online === null ? "" : (p.online ? "🟢 " : "⚙️ ")}${esc(p.text)}</div>`).join("")}
  <h4 class="sect">📤 导出</h4>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn-mini" id="btn-export-mem">📤 导出设定集（L9 记忆线）</button>
    <button class="btn-mini" id="btn-export-save">📤 导出存档（全量）</button>
    <button class="btn-mini" style="background:#161a28;color:#cdd6ec;border:1px solid #2a3a5c" id="btn-import-save">📥 导入存档</button>
    <input type="file" id="save-file" accept="application/json" style="display:none" />
  </div>`;
  $("btn-export-mem").onclick = () => download(`oriera-设定集-${GAME.id}.json`, mem.export());
  $("btn-export-save").onclick = () => {
    const data = {};
    for (let k = 0; k < localStorage.length; k++) {
      const key = localStorage.key(k);
      if (key && key.startsWith("game." + GAME.id + ".")) data[key] = localStorage.getItem(key);
    }
    download(`oriera-存档-${GAME.id}.json`, JSON.stringify({ game: GAME.id, saved_at: Date.now(), data }, null, 1));
  };
  $("btn-import-save").onclick = () => $("save-file").click();
  $("save-file").onchange = e => {
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result);
        Object.entries(j.data || {}).forEach(([k, v]) => localStorage.setItem(k, v));
        location.reload();
      } catch (err) { sys("存档文件无法识别"); }
    };
    r.readAsText(e.target.files[0]);
  };
}
function download(name, text) {
  const blob = new Blob([text], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}
function renderCodex() {
  const done = new Set(JSON.parse(localStorage.getItem(K("loop")) || "[]"));
  const el = $("page-codex");
  el.innerHTML = `
  <h4 class="sect">核心循环（点行勾销）</h4>
  ${GAME.core_loop.map((s, i) => `<div class="loop-step ${done.has(i) ? "done" : ""}" data-i="${i}"><span>${done.has(i) ? "✅" : "▫️"}</span><span>${esc(s)}</span></div>`).join("")}
  <h4 class="sect">机制系统</h4>
  ${GAME.mechanics.map(m => `<div class="mech"><b>${esc(m.name)}</b><div>${esc(m.detail)}</div></div>`).join("")}
  <h4 class="sect">经济循环</h4>

  ${GAME.economy.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.source)}</td><td>${esc(r.sink)}</td></tr>`).join("")}</table>

  <h4 class="sect">引擎挂点（vendored engine/kernel.js）</h4>
  ${[
    ["createProvider＋PROVIDER_PRESETS（:277-290）", "八厂商＋rule 预设；无 Key/断网返回 null，工作台自动切离线规则模式"],
    ["HttpChatProvider.complete（:65-96）", "三生成器共用同一 provider 实例；temp:0 真透传、json:true 走 response_format、max=分拨预算由端点硬执行"],
    ["provider.stats.tokens（:88-89）", "预算账本唯一数据源；每令记 before/after 差值按生成器分账"],
    ["MemoryStore（:13-53）", "每角色＋世界观各一条记忆线；record 写定稿、retrieve 召回锚点、export 出设定集"],
    ["Scheduler（:270-274）", "导演解析→三生成器→封板五系统注册其中，每令一次 tick pump"],
    ["DirectorSystem（:243-267）", "「世界脉搏」子系统：离线落 RULE_BEATS 规则行，演示黑匣对世界漂移的隔离"],
  ].map(([a, b]) => `<div class="mech"><b>${esc(a)}</b><div>${esc(b)}</div></div>`).join("")}`;
  el.querySelectorAll(".loop-step").forEach(d => d.onclick = () => {
    const i = +d.dataset.i;
    done.has(i) ? done.delete(i) : done.add(i);
    localStorage.setItem(K("loop"), JSON.stringify([...done]));
    renderCodex();

}
function renderHUD() {
  $("act").textContent = world.act;
  $("hud-bb").textContent = blackbox.length;
  $("hud-budget").textContent = curBudget();
}
function switchTab(t) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  document.querySelectorAll(".tab-page").forEach(p => p.classList.toggle("on", p.id === "page-" + t));
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => switchTab(b.dataset.t));

/* ============ 开场 ============ */
$("budget").value = TRACK.budgetDefaults.perOrder;
renderHUD(); renderBlackbox(); renderChars(); renderWorld(); renderCodex();
sys(`欢迎来到「${esc(GAME.name)}」。点一条预置导演令（或自己写一句）——离线规则模式即可看全三阶段；切在线见 README。`);
startScene();
</script>
